<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPS Calculator — FGD data entry</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#001B6E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calculadora CPS">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --tangerine: #FF8000; --tangerine-tint: #FFF1E0;
    --eggplant: #7B1DAB; --eggplant-tint: #F2E6F9;
    --flower: #FF4571;   --flower-tint: #FFE7ED;
    --sky: #0FC0FC;      --sky-tint: #E3F8FF;
    --mint: #09FBD3;     --mint-tint: #E0FFFA; --mint-dark: #0a7d5c;
    --night: #001B6E;    --grey: #9CA399; --grey-dark: #6b7268;
    --bg: #FFFFFF; --card: #FFFFFF; --card-alt: #F7F8F6;
    --border: #E3E5E0; --text: #1E1E1E; --text-light: #6b7268;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }

  header { background: #FFFFFF; padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    box-shadow: 0 1px 0 var(--border); border-bottom: 1px solid var(--border); }
  header .left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header .logo { font-family: 'Exo 2', sans-serif; font-size: 1.4rem; font-weight: 800;
    letter-spacing: .3px; text-transform: uppercase; color: var(--night); }
  header .logo span { font-style: italic; opacity: .65; font-size: 1rem; margin-left: 10px; font-weight: 600; text-transform: none; }
  .lang-switch { display: flex; align-items: center; gap: 10px; background: var(--tangerine-tint);
    border: 1px solid var(--tangerine); border-radius: 24px; padding: 6px 14px 6px 16px; }
  .lang-switch-label { font-size: .78rem; font-weight: 700; color: var(--night); }
  .lang-switch .toggle-group { border-color: var(--tangerine); }
  .lang-switch .toggle-group button { color: var(--tangerine); font-weight: 700; padding: 6px 14px; font-size: .82rem; }
  .lang-switch .toggle-group button.active { background: var(--tangerine); color: #fff; }

  /* ---- Top action bar: file actions, reachable from every tab ---- */
  .top-actions { background: var(--card-alt); border-bottom: 1px solid var(--border);
    padding: 10px 32px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .top-actions .spacer { flex: 1 1 auto; }
  .save-status { font-size: .74rem; color: var(--text-light); white-space: nowrap; }

  #dashboard { padding: 26px 32px; max-width: 1400px; margin: 0 auto; }

  .screen { display: none; }
  .screen.active { display: block; }

  .notice { background: var(--sky-tint); border-left: 4px solid var(--sky);
    padding: 12px 20px; font-size: .83rem; color: #003a52; margin-bottom: 22px; line-height: 1.55; border-radius: 0 8px 8px 0; }
  .notice strong { color: var(--night); }

  .setup-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(30,30,30,.08); padding: 18px 20px; margin-bottom: 22px;
    display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); }
  .field input, .field select {
    padding: 8px 11px; border: 1px solid var(--border); border-radius: 6px;
    font-family: 'Inter', sans-serif; font-size: .85rem; min-width: 170px; background: #fff; color: var(--text);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--tangerine); }
  .field.wage input { min-width: 150px; border-color: var(--tangerine); background: var(--tangerine-tint); font-weight: 600; }

  .tab-bar { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 2px solid var(--border); overflow-x: auto; }
  .tab-btn { background: none; border: none; padding: 12px 6px; margin-right: 22px; font-family: 'Exo 2', sans-serif;
    font-weight: 700; font-size: .92rem; color: var(--text-light); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab-btn.active { color: var(--night); border-bottom-color: var(--tangerine); }
  .tab-btn .step-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    border-radius: 50%; background: var(--border); color: var(--text-light); font-size: .72rem; margin-right: 7px; }
  .tab-btn.active .step-num { background: var(--tangerine); color: #fff; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .activity-group-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(30,30,30,.08); padding: 18px 20px; margin-bottom: 14px; }
  .activity-group-card h3 { font-family: 'Exo 2', sans-serif; font-size: .95rem; color: var(--night); margin-bottom: 4px; }
  .activity-group-card .group-desc { font-size: .78rem; color: var(--text-light); margin-bottom: 12px; }
  .activity-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 10px; }
  .activity-choice { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; font-size: .84rem; background: var(--card-alt); }
  .activity-choice:hover { border-color: var(--tangerine); }
  .activity-choice.checked { border-color: var(--tangerine); background: var(--tangerine-tint); }
  .activity-choice input { width: 16px; height: 16px; accent-color: var(--tangerine); flex-shrink: 0; }
  .continue-row { display: flex; justify-content: flex-end; margin-top: 18px; }

  .empty-state { background: var(--card-alt); border: 1px dashed var(--border); border-radius: 12px;
    padding: 30px; text-align: center; color: var(--text-light); font-size: .88rem; }
  .empty-state a { color: var(--tangerine); font-weight: 600; cursor: pointer; text-decoration: underline; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 26px;
    position: sticky; top: 10px; z-index: 20; }
  .kpi-card { background: var(--card); border-radius: 12px; padding: 16px 18px;
    box-shadow: 0 1px 3px rgba(30,30,30,.08); border: 1px solid var(--border);
    border-left: 4px solid var(--tangerine); }
  .kpi-card.night { border-left-color: var(--night); background: var(--night); }
  .kpi-card.night .kpi-label { color: rgba(255,255,255,.7); }
  .kpi-card.night .kpi-value { color: #fff; }
  .kpi-card.eggplant { border-left-color: var(--eggplant); }
  .kpi-card.sky { border-left-color: var(--sky); }
  .kpi-card.flower { border-left-color: var(--flower); }
  .kpi-card.mint { border-left-color: var(--mint-dark); }
  .kpi-card.grey { border-left-color: var(--grey-dark); }
  .kpi-label { font-size: .68rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .5px; color: var(--text-light); margin-bottom: 5px; }
  .kpi-value { font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: 1.4rem;
    color: var(--night); line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi-value small { font-size: .74rem; font-weight: 600; color: var(--text-light); }

  .section-title { font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: 1.05rem;
    color: var(--night); margin: 26px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .section-title:first-of-type { margin-top: 0; }
  .section-title .edit-activities-link { font-family: 'Inter', sans-serif; font-size: .76rem; font-weight: 600; color: var(--tangerine); cursor: pointer; text-decoration: underline; }

  .category { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(30,30,30,.08); margin-bottom: 14px; overflow: hidden; }
  .cat-head { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; cursor: pointer; flex-wrap: wrap; gap: 10px; background: var(--card-alt); }
  .cat-head .name { font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: .95rem; color: var(--night); }
  .cat-head .cat-right { display: flex; align-items: center; gap: 16px; }
  .cat-head .cat-total { font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: .98rem; color: var(--tangerine);
    font-variant-numeric: tabular-nums; }
  .chevron { font-size: .75rem; color: var(--text-light); transition: transform .15s; display: inline-block; }
  .cat-head.open .chevron { transform: rotate(90deg); }

  .toggle-group { display: inline-flex; border: 1px solid var(--night); border-radius: 20px; overflow: hidden; font-size: .72rem; }
  .toggle-group button { border: none; background: #fff; color: var(--night); padding: 5px 13px; cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif; }
  .toggle-group button.active { background: var(--night); color: #fff; }

  .cat-body { padding: 0; max-height: 0; overflow: hidden; transition: max-height .2s ease; }
  .cat-body.open { padding: 18px 20px 20px; max-height: 4000px; }

  .component-block { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .component-block.not-costed { border-color: var(--grey); }
  .component-block-head { display: flex; justify-content: space-between; align-items: center;
    background: var(--card-alt); padding: 9px 14px; gap: 10px; }
  .component-block-head .c-name { font-size: .78rem; font-weight: 600; color: var(--night); text-transform: uppercase; letter-spacing: .3px; }
  .component-block-head .c-name .c-hint { text-transform: none; font-weight: 400; color: var(--text-light); font-size: .72rem; letter-spacing: 0; }
  .component-block-head .c-subtotal { font-size: .8rem; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; text-align: right; }
  .component-block-head .c-subtotal .c-subtotal-days { display: block; font-size: .7rem; font-weight: 600; color: var(--text-light); }
  .entry-row { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .entry-row input[type=text] { flex: 1.3; min-width: 140px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 5px; font-size: .8rem; }
  .entry-row input[type=number] { flex: .7; min-width: 90px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 5px; font-size: .8rem; }
  .entry-row .computed-cost { flex: .8; font-size: .78rem; color: var(--text-light); font-variant-numeric: tabular-nums; text-align: right; padding-right: 4px; }
  .entry-row .remove-btn { background: none; border: none; color: var(--flower); cursor: pointer; font-size: .95rem; padding: 2px 6px; line-height: 1; }
  .entry-type-toggle { display: inline-flex; border: 1px solid var(--eggplant); border-radius: 14px; overflow: hidden; font-size: .68rem; flex-shrink: 0; }
  .entry-type-toggle button { border: none; background: #fff; color: var(--eggplant); padding: 4px 8px; cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif; }
  .entry-type-toggle button.active { background: var(--eggplant); color: #fff; }
  .add-entry-btn { display: block; width: 100%; text-align: left; background: none; border: none;
    border-top: 1px dashed var(--border); color: var(--tangerine); font-weight: 600; font-size: .78rem;
    padding: 8px 14px; cursor: pointer; }
  .add-entry-btn:hover { background: var(--tangerine-tint); }

  .activity-row { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--card-alt); }
  .activity-top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .activity-top input[type=text] { flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: .82rem; background: #fff; }
  .activity-remove { background: none; border: 1px solid var(--flower); color: var(--flower); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; font-size: .74rem; }
  .activity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; }
  .activity-grid .field label { color: var(--text-light); font-weight: 600; }
  .activity-grid input { background: #fff; }
  .add-activity-btn { background: #fff; border: 1px dashed var(--night); color: var(--night); border-radius: 6px;
    padding: 7px 14px; cursor: pointer; font-size: .78rem; font-weight: 600; }

  .activity-hired-block { border: 1px solid var(--eggplant-tint); border-radius: 8px; padding: 10px 12px; margin-top: 10px; background: #fff; }
  .activity-hired-block .ahb-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .activity-hired-block .c-name { font-size: .78rem; font-weight: 600; color: var(--night); text-transform: uppercase; letter-spacing: .3px; }
  .activity-hired-block .c-name .c-hint { text-transform: none; font-weight: 400; color: var(--text-light); font-size: .72rem; letter-spacing: 0; }
  .activity-hired-block .ahb-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .activity-hired-block .ahb-row input[type=number] { flex: 1; min-width: 140px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: .82rem; background: #fff; }
  .activity-hired-block .ahb-row .computed-cost { font-size: .8rem; font-weight: 600; color: var(--eggplant); white-space: nowrap; }

  .subtotal-line { font-size: .78rem; color: var(--text-light); text-align: right; margin-top: 8px; }
  .subtotal-line strong { color: var(--night); font-family: 'Exo 2', sans-serif; }
  .subtotal-line .note { display: block; font-size: .7rem; color: var(--grey-dark); margin-top: 2px; }

  .table-card { background: var(--card); border-radius: 12px; padding: 22px;
    box-shadow: 0 1px 3px rgba(30,30,30,.08); border: 1px solid var(--border); margin-top: 24px; }
  .table-card h3 { font-family: 'Exo 2', sans-serif; font-weight: 600; font-size: .95rem; color: var(--night); margin-bottom: 4px; }
  .table-card .table-note { font-size: .74rem; color: var(--text-light); margin-bottom: 12px; }
  table.dt { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.dt th { text-align: left; color: var(--text-light); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--border); }
  table.dt th.num, table.dt td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.dt td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
  table.dt tr.total-row td { font-weight: 700; color: var(--night); background: var(--tangerine-tint); border-top: 2px solid var(--tangerine); }

  .btn { padding: 10px 18px; border-radius: 8px; border: none; font-size: .82rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; min-height: 40px; }
  .btn-primary { background: var(--night); color: #fff; }
  .btn-save { background: var(--tangerine); color: #fff; }
  .btn-outline { background: #fff; border: 1px solid var(--night); color: var(--night); }
  .btn-danger { background: #fff; border: 1px solid var(--flower); color: var(--flower); }
  .btn-sm { padding: 6px 12px; font-size: .76rem; min-height: 34px; }
  .btn-icon { border: 1px solid var(--flower); background: #fff; color: var(--flower); border-radius: 6px;
    width: 34px; height: 34px; cursor: pointer; font-size: .9rem; }

  /* ---- Records list screen ---- */
  .records-count { color: var(--text-light); font-size: .85rem; margin: -6px 0 14px; }
  .records-list { display: flex; flex-direction: column; gap: 10px; }
  .record-card { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
    border: 1px solid var(--border); border-left: 4px solid var(--tangerine); border-radius: 10px;
    padding: 14px 16px; background: var(--card-alt); }
  .record-card.current { border-left-color: var(--night); background: #fff; box-shadow: 0 1px 3px rgba(30,30,30,.08); }
  .record-card-main { flex: 1 1 260px; }
  .record-card-title { font-weight: 700; color: var(--night); font-family: 'Exo 2', sans-serif; font-size: 1.02rem; }
  .record-card-sub { color: var(--text-light); font-size: .85rem; margin-top: 2px; }
  .record-card-total { color: var(--night); font-size: .85rem; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .record-card-date { color: var(--grey-dark); font-size: .76rem; margin-top: 4px; }
  .record-card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .records-empty { text-align: center; padding: 40px 20px; }
  .records-empty h2 { color: var(--night); font-family: 'Exo 2', sans-serif; font-size: 1.1rem; margin-bottom: 8px; }
  .records-empty p { color: var(--text-light); font-size: .88rem; margin-bottom: 18px; }

  .entry-row-item { flex-direction: column; align-items: stretch; gap: 6px; }
  .entry-row-item .item-cell { display: flex; gap: 8px; align-items: center; }
  .entry-row-item .item-cell select.item-select { flex: 1.4; min-width: 150px; padding: 6px 9px;
    border: 1px solid var(--border); border-radius: 5px; font-size: .8rem; font-family: 'Inter', sans-serif; background: #fff; }
  .entry-row-item .item-cell input.item-other { flex: 1; min-width: 120px; padding: 6px 9px;
    border: 1px solid var(--tangerine); border-radius: 5px; font-size: .8rem; background: var(--tangerine-tint); }
  .entry-row-item .qty-cell { display: flex; gap: 8px; align-items: center; }
  .entry-row-item .qty-cell input[type=number] { flex: 1; min-width: 70px; padding: 6px 9px;
    border: 1px solid var(--border); border-radius: 5px; font-size: .8rem; }
  .entry-row-item .qty-cell select { flex: .7; min-width: 78px; padding: 6px 9px;
    border: 1px solid var(--border); border-radius: 5px; font-size: .8rem; font-family: 'Inter', sans-serif; background: #fff; }

  .block-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--eggplant);
    border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(30,30,30,.08); }
  .block-title { font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: 1rem; color: var(--night); }
  .block-sub { font-size: .78rem; color: var(--text-light); margin-top: 3px; }
  .block-figures { display: flex; gap: 22px; flex-wrap: wrap; }
  .block-figures .b-label { display: block; font-size: .66rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .5px; color: var(--text-light); }
  .block-figures .b-value { font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: 1.05rem;
    color: var(--night); font-variant-numeric: tabular-nums; }

  .headline-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 12px; }
  .detail-strip { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(30,30,30,.08); padding: 12px 18px; margin-bottom: 22px;
    display: flex; gap: 24px; flex-wrap: wrap; }
  .detail-strip .d-item { min-width: 96px; }
  .detail-strip .d-label { font-size: .64rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .5px; color: var(--text-light); }
  .detail-strip .d-value { font-size: .92rem; font-weight: 600; color: var(--night);
    font-variant-numeric: tabular-nums; margin-top: 2px; }

  .land-bar { display: flex; height: 9px; border-radius: 5px; overflow: hidden; margin-top: 12px; background: var(--card-alt); }
  .land-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 7px; font-size: .72rem; color: var(--text-light); }
  .land-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .status-chip { border: 1px solid var(--eggplant); border-radius: 14px; background: var(--eggplant-tint);
    color: var(--eggplant); font-weight: 600; font-size: .68rem; padding: 4px 10px; white-space: nowrap; }
  .results-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--night);
    border-radius: 0; box-shadow: 0 1px 3px rgba(30,30,30,.08); padding: 16px 20px; margin-top: 24px; }
  .results-card h3 { font-family: 'Exo 2', sans-serif; font-size: .95rem; color: var(--night); margin-bottom: 12px; }
  .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 14px; }
  .results-grid .r-label { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); }
  .results-grid .r-value { font-family: 'Exo 2', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--night);
    font-variant-numeric: tabular-nums; margin-top: 4px; }
  table.dt tr.block-row td { background: var(--card-alt); font-weight: 700; color: var(--night); }

  .search-bar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(30,30,30,.08); padding: 14px 18px; margin-bottom: 14px; }
  .search-bar .field { flex: 1 1 260px; }
  .search-bar .field input { min-width: 0; width: 100%; }

  .filter-bar { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(30,30,30,.08); padding: 14px 18px; margin-bottom: 14px; }
  .filter-bar select { min-width: 150px; }
  .filter-bar .filter-reset { align-self: flex-end; }

  .warn-note { background: var(--tangerine-tint); border-left: 4px solid var(--tangerine);
    padding: 10px 16px; font-size: .8rem; color: #8a4500; margin-bottom: 14px; border-radius: 0 8px 8px 0; }

  /* ---- Confirmation dialog. Native confirm() is unreliable in iOS browsers
         that are not Safari, so this is plain in-page HTML instead. ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(30,30,30,.45);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-box { background: #fff; border-radius: 12px; padding: 22px; max-width: 380px; width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .modal-box p { margin-bottom: 18px; font-size: .95rem; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  @media (max-width: 900px) {
    #dashboard { padding: 18px 14px; }
    header, .top-actions { padding-left: 14px; padding-right: 14px; }
    .kpi-grid { position: static; }
  }

  /* ---- Phones: turn wide data tables into stacked cards, one per row.
         Only presentation changes here; CSV and JSON exports are built
         from the data, not from this markup, so they are unaffected. ---- */
  @media (max-width: 700px) {
    .top-actions { gap: 6px; padding: 8px 12px; }
    .top-actions .btn { padding: 7px 10px; font-size: .74rem; min-height: 36px; flex: 1 1 auto; }
    .top-actions .spacer { display: none; }
    .save-status { flex: 1 1 100%; }
    .table-card { padding: 14px; }
    .search-bar { padding: 12px; gap: 10px; }
    .detail-strip { gap: 14px; padding: 12px; }
    .block-figures { gap: 14px; }
    .filter-bar { padding: 12px; gap: 10px; }
    .filter-bar .field { flex: 1 1 140px; }
    .filter-bar select { min-width: 0; width: 100%; }
    .record-card-actions .btn { flex: 1 1 auto; }

    table.dt thead { display: none; }
    table.dt, table.dt tbody, table.dt tr, table.dt td { display: block; width: 100%; }
    table.dt tr { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px;
      padding: 4px 0 6px; background: var(--card); }
    table.dt td { border-bottom: 1px dotted var(--border); padding: 7px 12px;
      display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
    table.dt td:last-child { border-bottom: none; }
    table.dt td::before { content: attr(data-label); flex: 1 1 auto; text-align: left;
      font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; color: var(--text-light); }
    table.dt td.num { text-align: right; }
    table.dt td.row-head { background: var(--card-alt); border-bottom: 1px solid var(--border);
      font-family: 'Exo 2', sans-serif; font-weight: 700; color: var(--night); font-size: .9rem; display: block; }
    table.dt td.row-head::before { content: none; }
    table.dt td.empty-cell { display: none; }
    table.dt tr.total-row { border: 2px solid var(--tangerine); }
    table.dt tr.total-row td { background: transparent; }
    table.dt tr.total-row td.row-head { background: var(--tangerine-tint); }
  }

  @media print {
    header, .top-actions, .tab-bar, .btn, .add-entry-btn, .add-activity-btn, .modal-overlay { display: none !important; }
    .table-card, .category { border: none; box-shadow: none; }
  }
</style>
</head>
<body>

<header>
  <div class="left">
    <div class="logo" data-i18n="app_title">CPS Calculator <span data-i18n="app_subtitle">FGD data entry</span></div>
  </div>
  <div class="lang-switch">
    <span class="lang-switch-label" data-i18n="lang_switch_label">Language:</span>
    <div class="toggle-group" id="langToggle">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="pt">PT</button>
    </div>
  </div>
</header>

<!-- File actions live here so they are reachable from every tab, not only the last one. -->
<div class="top-actions">
  <button type="button" class="btn btn-outline btn-sm" id="btnMyRecords" data-i18n="btn_my_records">My FGDs</button>
  <button type="button" class="btn btn-save btn-sm" id="btnNewRecord" data-i18n="btn_new_record">+ New FGD</button>
  <button type="button" class="btn btn-outline btn-sm editor-only" id="btnExportJson" data-i18n="btn_export_this_json">Save this FGD (JSON)</button>
  <button type="button" class="btn btn-outline btn-sm editor-only" id="btnExportCsv" data-i18n="btn_export_this_csv">Export this FGD (CSV)</button>
  <button type="button" class="btn btn-primary btn-sm" id="btnExportAllCsv" data-i18n="btn_export_all_csv">Export all (CSV)</button>
  <button type="button" class="btn btn-primary btn-sm" id="btnExportAllJson" data-i18n="btn_export_all_json">Back up all (JSON)</button>
  <button type="button" class="btn btn-outline btn-sm" id="btnImportJson" data-i18n="btn_import_json">Load JSON</button>
  <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">
  <button type="button" class="btn btn-danger btn-sm" id="btnDeleteAll" data-i18n="btn_delete_all">Delete all data</button>
  <span class="spacer"></span>
  <span class="save-status" id="saveStatus" data-i18n="save_status_auto">Autosaved</span>
</div>

<div id="dashboard">

  <!-- ============ Screen A: list of FGDs stored on this device ============ -->
  <div class="screen" id="screenList">

    <div class="tab-bar">
      <button type="button" class="tab-btn" id="listTabRecords" data-i18n="tab_list_records">My FGDs</button>
      <button type="button" class="tab-btn" id="listTabCompare" data-i18n="tab_list_compare">Compare FGDs</button>
      <button type="button" class="tab-btn" id="listTabItems" data-i18n="tab_list_items">Inputs and costs</button>
    </div>

    <div class="tab-panel" id="listPanelRecords">
      <div class="notice" data-i18n="records_help"></div>
      <!-- Deliberately outside #recordsListContainer: that container is rebuilt on every
           keystroke, and an input inside it would be destroyed and lose focus each time. -->
      <div class="search-bar" id="recordSearchBar">
        <div class="field">
          <label for="recordSearch" data-i18n="search_label">Search</label>
          <input type="search" id="recordSearch" autocomplete="off" data-i18n-ph="search_placeholder"
            placeholder="FGD name, cooperative or FLO-ID">
        </div>
        <button type="button" class="btn btn-outline btn-sm" id="recordSearchClear" data-i18n="search_clear">Clear</button>
      </div>
      <div id="recordsListContainer"></div>
    </div>

    <div class="tab-panel" id="listPanelCompare">
      <div class="notice" data-i18n="compare_help"></div>
      <div id="compareContainer"></div>
    </div>

    <div class="tab-panel" id="listPanelItems">
      <div class="notice" data-i18n="items_help"></div>
      <div id="itemsContainer"></div>
    </div>

  </div>

  <!-- ============ Screen B: one FGD open for editing ============ -->
  <div class="screen" id="screenEditor">

    <div class="notice" data-i18n="notice"></div>

    <div class="setup-card">
      <div class="field">
        <label data-i18n="field_fgd_name">FGD name or code</label>
        <input type="text" id="fgdName" placeholder="e.g. FGD_Peru_Cusco_01">
      </div>
      <div class="field">
        <label data-i18n="field_flo_id">FLO-ID</label>
        <input type="text" id="floId" placeholder="FLO-ID" style="min-width:120px">
      </div>
      <div class="field">
        <label data-i18n="field_coop_name">Cooperative name</label>
        <input type="text" id="coopName" placeholder="" style="min-width:180px">
      </div>
      <div class="field">
        <label data-i18n="field_country">Country</label>
        <select id="country" style="min-width:150px"></select>
      </div>
      <div class="field">
        <label data-i18n="field_area_unit">Area unit</label>
        <select id="areaUnit">
          <option value="ha" data-i18n="area_unit_ha">Hectare (ha)</option>
          <option value="mz" data-i18n="area_unit_mz">Manzana</option>
          <option value="acre" data-i18n="area_unit_acre">Acre</option>
          <option value="otro" data-i18n="area_unit_other">Other</option>
        </select>
      </div>
      <div class="field" id="areaUnitOtherField" style="display:none;">
        <label data-i18n="field_area_unit_other_name">Name of that unit</label>
        <input type="text" id="areaUnitOther" placeholder="e.g. cuerda, tarea" style="min-width:150px">
      </div>
      <div class="field">
        <label data-i18n="field_currency">Local currency</label>
        <input type="text" id="currency" placeholder="e.g. PEN, COP, GTQ" style="min-width:110px">
      </div>
      <div class="field wage">
        <label data-i18n="field_daily_wage">Daily wage (currency/day)</label>
        <input type="number" step="any" min="0" id="dailyWage" placeholder="0.00">
      </div>
    </div>

    <div class="tab-bar" id="editorTabBar">
      <button type="button" class="tab-btn" id="tabBtnActivities" data-tab="activities"><span class="step-num">1</span><span data-i18n="tab1_label">Farm activities</span></button>
      <button type="button" class="tab-btn" id="tabBtnBlock_establishment" data-tab="block_establishment"><span class="step-num">2</span><span data-i18n="status_establishment">Establishment</span></button>
      <button type="button" class="tab-btn" id="tabBtnBlock_renovation" data-tab="block_renovation"><span class="step-num">3</span><span data-i18n="status_renovation">Renovation</span></button>
      <button type="button" class="tab-btn" id="tabBtnQuestionnaire" data-tab="questionnaire"><span class="step-num">4</span><span data-i18n="tab2_label">Cost questionnaire</span></button>
    </div>

    <div id="blockTabsContainer"></div>

    <div class="tab-panel" id="tabPanelActivities">
      <div class="activity-group-card">
        <h3 data-i18n="land_card_title">Coffee land on the farm</h3>
        <div class="group-desc" data-i18n="land_card_desc"></div>
        <div class="setup-card" style="box-shadow:none; border:none; padding:0; margin-bottom:0;">
          <div class="field">
            <label data-i18n-unit="area_establishment_l">Establishment (new areas)</label>
            <input type="number" step="any" min="0" id="areaEstablishment" placeholder="0.00">
          </div>
          <div class="field">
            <label data-i18n-unit="area_renovation_l">Renovation / rehabilitation</label>
            <input type="number" step="any" min="0" id="areaRenovation" placeholder="0.00">
          </div>
          <div class="field">
            <label data-i18n-unit="area_productive_l">Productive areas</label>
            <input type="number" step="any" min="0" id="areaProductive" placeholder="0.00">
          </div>
          <div class="field">
            <label data-i18n="area_total">Total coffee area</label>
            <input type="text" id="areaTotalDisplay" disabled style="background:var(--card-alt); font-weight:600; color:var(--eggplant);">
          </div>
        </div>
        <div class="land-bar" id="landBar"></div>
        <div class="land-legend" id="landLegend"></div>
        <div class="table-note" style="margin-top:10px;" id="landNote"></div>
      </div>
      <div class="activity-group-card">
        <h3 data-i18n="presentation_card_title">Coffee type and yield</h3>
        <div class="group-desc" data-i18n="presentation_card_desc"></div>
        <div class="setup-card" style="box-shadow:none; border:none; padding:0; margin-bottom:0;">
          <div class="field">
            <label data-i18n="field_presentation">Coffee type sold</label>
            <select id="presentationSelect"></select>
          </div>
          <div class="field">
            <label data-i18n="field_gbe_ratio">Kg of this type = 1 kg GBE</label>
            <input type="number" step="any" min="0" id="gbeRatioInput" placeholder="e.g. 5.00">
          </div>
          <div class="field">
            <label data-i18n-unit="field_yield">Real yield (kg per area unit, in that type)</label>
            <input type="number" step="any" min="0" id="yieldPerHaInput" placeholder="0.00">
          </div>
          <div class="field">
            <label data-i18n="field_yield_equiv">Equivalent yield</label>
            <input type="text" id="yieldGbeDisplay" disabled style="background:var(--card-alt); font-weight:600; color:var(--eggplant);">
          </div>
        </div>
      </div>
      <div id="activityGroupsContainer"></div>
      <div class="continue-row">
        <button type="button" class="btn btn-primary" id="continueToQuestionnaire" data-i18n="continue_btn">Continue to questionnaire →</button>
      </div>
    </div>

    <div class="tab-panel" id="tabPanelQuestionnaire">

      <div class="headline-grid" id="headlineGrid"></div>
      <div class="detail-strip" id="detailStrip"></div>

      <div class="section-title">
        <span data-i18n="section_categories">Cost categories</span>
        <span class="edit-activities-link" id="editActivitiesLink" data-i18n="edit_activities_link">Edit selected activities</span>
      </div>
      <div id="categoriesContainer"></div>

      <div class="table-card">
        <h3 data-i18n="table_title">Summary by category</h3>
        <div class="table-note" data-i18n="table_note"></div>
        <table class="dt" id="summaryTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

    </div>

  </div>
</div>

<div class="modal-overlay" id="confirmModal" style="display:none;">
  <div class="modal-box">
    <p id="confirmModalMessage"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="confirmModalCancel" data-i18n="modal_cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirmModalOk" data-i18n="modal_confirm">Confirm</button>
    </div>
  </div>
</div>

let appLang = "en";
function t(key){
  return (TRANSLATIONS[appLang] && TRANSLATIONS[appLang][key]) || TRANSLATIONS.en[key] || key;
}

// The area unit is chosen per FGD, so every label that mentions one is built at
// render time rather than hardcoded. Strings carry {u} for the area unit and {c}
// for the currency; ti() fills them in for a given record.
function areaUnitOf(rec){
  const r = rec || state;
  if(!r) return t("unit_short_ha");
  if(r.areaUnit === "otro") return (r.areaUnitOther || "").trim() || t("unit_generic");
  return t("unit_short_" + r.areaUnit) || t("unit_generic");
}
function currencyOf(rec){
  const r = rec || state;
  return (r && (r.currency || "").trim()) || t("unit_currency_generic");
}
// An "annual overhead" category is captured as a yearly total, so its labels must not
// say "per hectare". Every other category is per unit of its own block's area.
function unitSuffixForCat(catId){
  return state && statusOfCategory(state, catId) === "annual"
    ? t("unit_per_year") : ti("unit_per_area");
}

function ti(key, rec){
  return t(key).replace(/\{u\}/g, areaUnitOf(rec)).replace(/\{c\}/g, currencyOf(rec));
}

// Escapes text before it goes into an HTML attribute or text node. Without this a
// quote or angle bracket typed by a farmer (e.g. a 5" pipe) breaks the row it sits in.
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// ---- Land status blocks ----
// A farm's coffee land sits in three states plus a fourth bucket for overheads that are
// not tied to any area. Costs in the three area blocks are captured per unit of THAT
// block's area and multiplied by it; "annual" costs are absolute yearly amounts.
// No amortisation happens anywhere: the blocks are summed as they stand, per the
// COSP methodology, so a year with new plantings genuinely reads as a more expensive year.
const LAND_STATUSES = [
  { id: "establishment", labelKey: "status_establishment", areaKey: "establishment" },
  { id: "renovation",    labelKey: "status_renovation",    areaKey: "renovation" },
  { id: "productive",    labelKey: "status_productive",    areaKey: "productive" },
  { id: "annual",        labelKey: "status_annual",        areaKey: null }
];
function statusById(id){ return LAND_STATUSES.find(s => s.id === id); }

// Establishment and renovation costs are captured on their own tabs, so every category
// left in the questionnaire belongs to the productive block. Farm administration is the
// one exception: it is annual overhead and is not tied to any area.
const BLOCK_TABS = ["establishment", "renovation"];
function statusOfCategory(rec, catId){
  return catId === "admin" ? "annual" : "productive";
}

        { code: "pe_compost_pulpa",comp: "inputs",   label: "Compost de pulpa de caf\u00e9" },

        { code: "hn_cal_agricola", comp: "inputs",   label: "Cal agr\u00edcola" } ],
  NI: [ { code: "ni_gallinaza",    comp: "inputs",   label: "Gallinaza" },

function catalogFor(rec, compId){
  const country = (rec && rec.country) || "";
  const extra = CATALOG_COUNTRY[country] || [];
  const base = CATALOG_BASE.filter(i => i.comp === compId).map(i => ({ code: i.code, label: t(i.key) }));
  const local = extra.filter(i => i.comp === compId).map(i => ({ code: i.code, label: i.label }));
  return base.concat(local).sort((a, b) => a.label.localeCompare(b.label));
}
function catalogLabel(code){
  if(!code) return "";
  const b = CATALOG_BASE.find(i => i.code === code);
  if(b) return t(b.key);
  for(const c of Object.keys(CATALOG_COUNTRY)){
    const f = CATALOG_COUNTRY[c].find(i => i.code === code);
    if(f) return f.label;
  }
  return "";
}

// Coffee presentation options and GBE conversion ratios (kg of that presentation per 1 kg GBE).
// cherry/dry_parchment derived from FI's own survey glossary; dried_cherry and wet_parchment per Jonnathan.
const PRESENTATIONS = [
  { value: "cherry",        labelKey: "presentation_cherry",        defaultRatio: "5.00" },
  { value: "dried_cherry",  labelKey: "presentation_dried_cherry",  defaultRatio: "2.00" },
  { value: "wet_parchment", labelKey: "presentation_wet_parchment", defaultRatio: "2.56" },

  { value: "green_bean",    labelKey: "presentation_green_bean",    defaultRatio: "1.00" }
];
function presentationLabel(value){

// ==================== STORAGE ====================
// One key holds every FGD captured on this device, as a map of id -> record.
// Earlier versions stored a single FGD under STORAGE_KEY_LEGACY; that record is
// migrated into the map the first time this version loads, so nothing is lost.
const STORAGE_KEY_RECORDS = "cosp_fgd_records_v2";
const STORAGE_KEY_PREV_V1 = "cosp_fgd_records_v1";
const STORAGE_KEY_LEGACY  = "cosp_fgd_calculator_state_v5";
const STORAGE_KEY_LANG    = "cosp_fgd_lang_v1";

let records = {};       // id -> record
let currentId = null;   // id of the record open in the editor
let state = null;       // the open record itself (kept as `state` so the form code reads the same)
let screen = "list";    // "list" = overview of FGDs, "editor" = one FGD open
let compareFilters = { presentation: "", currency: "", areaUnit: "" };
let recordSearch = "";  // in memory only: a search that survived a restart would hide
                        // most of the list and look like lost data

function generateRecordId(){
  return "fgd_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
}

function emptyEntry(comp){
  if(comp.hasDepreciation) return { label: "", purchaseCost: "", usefulLife: "" };
  // Quantity and unit are optional throughout: a focus group often knows what was spent
  // without knowing how many kilos it bought, and a required field would invite invention.
  if(comp.type === "currency") return { code: "", label: "", qty: "", unit: "", value: "" };
  if(comp.hasContractOption) return { label: "", entryType: "days", days: "", value: "" };
  return { label: "", days: "" };
}

function emptyGlobal(){
  const g = {};
  COMPONENTS.forEach(c => { g[c.id] = [emptyEntry(c)]; });
  return g;
}

function emptyActivityComponents(){
  const c = {};
  COMPONENTS.forEach(k => {
    if(k.hasContractOption) c[k.id] = { entryType: "days", days: "", value: "" };
    else if(k.hasDepreciation) c[k.id] = { purchaseCost: "", usefulLife: "" };
    else c[k.id] = "";
  });
  return c;
}

function emptyActivitiesState(){
  const a = {};
  ACTIVITY_GROUPS.forEach(g => a[g.id] = []);
  return a;
}

function defaultRecord(){
  const cats = {};
  CATEGORIES.forEach(cat => {
    cats[cat.id] = {
      mode: "global",
      global: emptyGlobal(),
      activities: [ { name: "", ...emptyActivityComponents() } ],
      open: false
    };
  });
  return {
    meta: {
      id: generateRecordId(),
      formatVersion: 6,
      lang: appLang,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    },
    fgdName: "", floId: "", coopName: "", country: "", areaUnit: "ha", areaUnitOther: "", currency: "", dailyWage: "",
    presentation: "cherry", gbeRatio: "5.00", yieldPerHa: "",
    areas: { establishment: "", renovation: "", productive: "" },
    // Establishment and renovation are captured as a flat set of Tier 3 questions rather
    // than by category: a focus group will not break a new planting down nine ways.
    blockCosts: { establishment: emptyGlobal(), renovation: emptyGlobal() },
    selectedActivities: emptyActivitiesState(),
    activeTab: "activities",
    categories: cats
  };
}

function sanitizeRecord(parsed){
  const base = defaultRecord();
  const merged = Object.assign(base, parsed, {
    meta: Object.assign(base.meta, (parsed && parsed.meta) || {}),
    areas: Object.assign(base.areas, (parsed && parsed.areas) || {}),
    blockCosts: Object.assign(base.blockCosts, (parsed && parsed.blockCosts) || {}),
    selectedActivities: Object.assign(base.selectedActivities, (parsed && parsed.selectedActivities) || {}),
    categories: Object.assign(base.categories, (parsed && parsed.categories) || {})
  });
  if(!merged.meta.id) merged.meta.id = generateRecordId();
  // The comparison moved out of the editor, so a record saved on that tab must not
  // reopen onto a tab that no longer exists there.
  if(merged.activeTab !== "questionnaire") merged.activeTab = "activities";
  // Records saved before this version had lang at the top level instead of in meta.
  if(parsed && parsed.lang && !(parsed.meta && parsed.meta.lang)) merged.meta.lang = parsed.lang;
  // Migrate sessions saved before the switch from a "kg presentation x factor = kg GBE" multiplier
  // to a "kg presentation per 1 kg GBE" ratio (the farmer-facing framing).
  if(parsed && parsed.gbeFactor !== undefined && parsed.gbeRatio === undefined){
    const f = num(parsed.gbeFactor);
    merged.gbeRatio = f > 0 ? (1 / f).toFixed(2) : "";
  }
  // Records captured before establishment and renovation had their own tabs kept those
  // costs in two categories that no longer exist. Fold them into the matching block so
  // nothing already collected in the field is lost.
  const LEGACY_CAT_TO_BLOCK = { land_prep: "establishment", renovation: "renovation" };
  Object.keys(LEGACY_CAT_TO_BLOCK).forEach(oldCat => {
    const legacy = parsed && parsed.categories && parsed.categories[oldCat];
    if(!legacy) return;
    const target = merged.blockCosts[LEGACY_CAT_TO_BLOCK[oldCat]];
    COMPONENTS.forEach(c => {
      const moved = [];
      if(legacy.mode === "activity" && Array.isArray(legacy.activities)){
        // Activity rows carry no per-item description, so the activity name becomes the label.
        legacy.activities.forEach(act => {
          const v = act[c.id];
          if(c.hasDepreciation && v && (v.purchaseCost || v.usefulLife)) moved.push({ label: act.name || "", purchaseCost: v.purchaseCost || "", usefulLife: v.usefulLife || "" });
          else if(c.hasContractOption && v && (v.days || v.value)) moved.push({ label: act.name || "", entryType: v.entryType || "days", days: v.days || "", value: v.value || "" });
          else if(c.type === "days" && v) moved.push({ label: act.name || "", days: v });
          else if(c.type === "currency" && v) moved.push({ code: "", label: act.name || "", qty: "", unit: "", value: v });
        });
      }else if(legacy.global && Array.isArray(legacy.global[c.id])){
        legacy.global[c.id].forEach(e => {
          const hasValue = e && (e.value || e.days || e.purchaseCost);
          if(hasValue) moved.push(Object.assign({}, e));
        });
      }
      if(moved.length){
        const existing = (target[c.id] || []).filter(e => e.value || e.days || e.purchaseCost);
        target[c.id] = existing.concat(moved);
      }
    });
    delete merged.categories[oldCat];
  });

  CATEGORIES.forEach(cat => {
    const cs = merged.categories[cat.id];
    delete cs.status;                    // status is now implied by which tab the cost sits on
    if(!cs.global) cs.global = emptyGlobal();
    COMPONENTS.forEach(c => {
      if(!Array.isArray(cs.global[c.id]) || !cs.global[c.id].length){
        cs.global[c.id] = [emptyEntry(c)];
      }
      normaliseEntries(cs.global[c.id], c);
    });
    if(!cs.activities || !cs.activities.length) cs.activities = [ { name: "", ...emptyActivityComponents() } ];
    cs.activities.forEach(act => {
      COMPONENTS.forEach(c => {
        if(c.hasContractOption){
          if(typeof act[c.id] !== "object" || act[c.id] === null){
            act[c.id] = { entryType: "days", days: act[c.id] || "", value: "" };
          }
          if(!act[c.id].entryType) act[c.id].entryType = "days";
        }
        if(c.hasDepreciation){
          if(typeof act[c.id] !== "object" || act[c.id] === null){
            act[c.id] = { purchaseCost: act[c.id] || "", usefulLife: "1" };
          }
          if(act[c.id].usefulLife === undefined) act[c.id].usefulLife = "";
        }
      });
    });
  });
  // Block containers use the same entry shapes as a category's global bucket.
  BLOCK_TABS.forEach(blockId => {
    const bc = merged.blockCosts[blockId] || (merged.blockCosts[blockId] = emptyGlobal());
    COMPONENTS.forEach(c => {
      if(!Array.isArray(bc[c.id]) || !bc[c.id].length) bc[c.id] = [emptyEntry(c)];
      normaliseEntries(bc[c.id], c);
    });
  });
  return merged;
}

// Fills in fields added by later versions so old entries keep working unchanged.
function normaliseEntries(entries, comp){
  entries.forEach(e => {
    if(comp.hasContractOption){
      if(!e.entryType) e.entryType = "days";
      if(e.value === undefined) e.value = "";
    }
    if(comp.hasDepreciation){
      if(e.purchaseCost === undefined){ e.purchaseCost = e.value !== undefined ? e.value : ""; e.usefulLife = "1"; }
      if(e.usefulLife === undefined) e.usefulLife = "";
    }
    if(comp.type === "currency" && !comp.hasDepreciation){
      if(e.code === undefined) e.code = "";
      if(e.qty === undefined) e.qty = "";
      if(e.unit === undefined) e.unit = "";
    }
  });
}

function loadAllRecords(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_RECORDS);
    if(raw){
      const parsed = JSON.parse(raw);
      const map = {};
      Object.values(parsed).forEach(r => {
        const rec = sanitizeRecord(r);
        map[rec.meta.id] = rec;
      });
      return map;
    }
  }catch(e){ /* fall through to the older keys below */ }
  // GitHub Pages project sites share one origin, so a v1 install and this one see the
  // same localStorage. Copy v1's records across once, without deleting them, so the
  // older app keeps working untouched if it is still installed on the device.
  try{
    const prev = localStorage.getItem(STORAGE_KEY_PREV_V1);
    if(prev){
      const parsed = JSON.parse(prev);
      const map = {};
      Object.values(parsed).forEach(r => { const rec = sanitizeRecord(r); map[rec.meta.id] = rec; });
      persistAllRecords(map);
      return map;
    }
  }catch(e){ /* fall through to the legacy single-FGD key */ }
  try{
    const legacy = localStorage.getItem(STORAGE_KEY_LEGACY);
    if(legacy){
      const rec = sanitizeRecord(JSON.parse(legacy));
      const map = { [rec.meta.id]: rec };
      persistAllRecords(map);
      localStorage.removeItem(STORAGE_KEY_LEGACY);
      return map;
    }
  }catch(e){ /* nothing to migrate */ }
  return {};
}

function persistAllRecords(map){
  try{
    localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(map));
    return true;
  }catch(e){
    return false;
  }
}

function setSaveStatus(text){
  document.getElementById("saveStatus").textContent = text;
}

// Called on every keystroke by the form code. Stamps the open record and rewrites the map.
function saveState(){
  if(!state) return;
  state.meta.updatedAt = new Date().toISOString();
  state.meta.lang = appLang;
  records[state.meta.id] = state;
  if(persistAllRecords(records)){
    setSaveStatus(t("save_status_auto") + " " + new Date().toLocaleTimeString());
  }else{
    // localStorage can be blocked in private browsing or when storage is full.
    // Data still lives in memory, so exports keep working; warn instead of failing silently.
    setSaveStatus(t("save_status_blocked"));
  }
}

// ==================== CALCULATION ====================
// These take an explicit record so the same functions serve the open FGD, the
// records list, the comparison tab, and the exports.

function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }

function wageOf(rec){ return num(rec.dailyWage); }
function wage(){ return state ? wageOf(state) : 0; }

function isCategoryVisibleIn(rec, cat){
  if(!cat.gate) return true;
  const selected = (rec.selectedActivities && rec.selectedActivities[cat.gate.group]) || [];
  return cat.gate.values.some(v => selected.includes(v));
}
function visibleCategoriesIn(rec){
  return CATEGORIES.filter(cat => isCategoryVisibleIn(rec, cat));
}
function visibleCategories(){
  return state ? visibleCategoriesIn(state) : [];
}

function depreciatedAnnualCost(entry){
  const life = num(entry.usefulLife) || 1;
  return num(entry.purchaseCost) / life;
}

// Monetary contribution of one component within a category (0 for non-costed "days" components)
function componentMonetary(rec, catState, comp){
  const w = wageOf(rec);
  if(catState.mode === "global"){
    const entries = catState.global[comp.id];
    if(comp.hasDepreciation){
      return entries.reduce((s,e) => s + depreciatedAnnualCost(e), 0);
    } else if(comp.type === "currency"){
      return entries.reduce((s,e) => s + num(e.value), 0);
    } else if(comp.hasContractOption){
      return entries.reduce((s,e) => {
        if(e.entryType === "lumpsum") return s + num(e.value);
        return s + num(e.days) * w;
      }, 0);
    } else {
      return comp.costed ? entries.reduce((s,e) => s + num(e.days) * w, 0) : 0;
    }
  } else {
    return catState.activities.reduce((s, act) => {
      if(comp.hasDepreciation) return s + depreciatedAnnualCost(act[comp.id] || {});
      if(comp.type === "currency") return s + num(act[comp.id]);
      if(comp.hasContractOption){
        const entry = act[comp.id] || {};
        if(entry.entryType === "lumpsum") return s + num(entry.value);
        return s + num(entry.days) * w;
      }
      return comp.costed ? s + num(act[comp.id]) * w : s;
    }, 0);
  }
}

// Days total for a "days"-type component within a category (lump-sum contract entries don't count as days)
function componentDays(catState, comp){
  if(comp.type !== "days") return 0;
  if(catState.mode === "global"){
    return catState.global[comp.id].reduce((s,e) => {
      if(comp.hasContractOption && e.entryType === "lumpsum") return s;
      return s + num(e.days);
    }, 0);
  } else {
    return catState.activities.reduce((s, act) => {
      if(comp.hasContractOption){
        const entry = act[comp.id] || {};
        if(entry.entryType === "lumpsum") return s;
        return s + num(entry.days);
      }
      return s + num(act[comp.id]);
    }, 0);
  }
}

function categoryTotal(rec, catState){
  return COMPONENTS.reduce((s,c) => s + componentMonetary(rec, catState, c), 0);
}
function categoryHouseholdDays(catState){
  return componentDays(catState, COMPONENTS.find(c => c.id === "household"));
}
function categoryHiredDays(catState){
  return componentDays(catState, COMPONENTS.find(c => c.id === "hired"));
}

function yieldOf(rec){ return num(rec.yieldPerHa); }
function gbeRatioOf(rec){ return num(rec.gbeRatio); }
function yieldGbeOf(rec){ const r = gbeRatioOf(rec); return r > 0 ? yieldOf(rec) / r : 0; }
function pricePresOf(rec, total){ const y = yieldOf(rec); return y > 0 ? total / y : null; }
function priceGbeOf(rec, total){ const y = yieldGbeOf(rec); return y > 0 ? total / y : null; }

// ---- Farm areas ----
function areaFor(rec, statusId){
  const st = statusById(statusId);
  if(!st || !st.areaKey) return null;              // "annual": not tied to an area
  return num((rec.areas || {})[st.areaKey]);
}
function totalFarmArea(rec){
  const a = rec.areas || {};
  return num(a.establishment) + num(a.renovation) + num(a.productive);
}
// With no areas entered the tool behaves exactly as it did before land blocks existed:
// one cost per unit of area, divided by one yield. Nothing already captured changes.
function usesBlocks(rec){ return totalFarmArea(rec) > 0; }

// A block's costs live in a flat bucket of the same shape as a category's global bucket,
// so they can be measured with the same functions.
function blockState(rec, blockId){
  return { mode: "global", global: rec.blockCosts[blockId] };
}

// Everything the list screen, the comparison tab and the exports need about one FGD.
function recordSummary(rec){
  const useBlocks = usesBlocks(rec);
  const comps = {};
  COMPONENTS.forEach(c => comps[c.id] = 0);
  const blocks = {};
  LAND_STATUSES.forEach(st => blocks[st.id] = {
    area: st.areaKey ? num((rec.areas || {})[st.areaKey]) : null,
    perArea: 0, total: 0, hhDays: 0, hiredDays: 0
  });

  const perCategory = {};
  let total = 0, hhDays = 0, hiredDays = 0;

  // Establishment and renovation: one flat bucket each, priced per unit of their own area.
  BLOCK_TABS.forEach(blockId => {
    if(!useBlocks) return;                       // no areas entered: these tabs are not in play
    const bs = blockState(rec, blockId);
    const area = blocks[blockId].area || 0;
    const perArea = categoryTotal(rec, bs);
    const bHh = categoryHouseholdDays(bs);
    const bHired = categoryHiredDays(bs);
    blocks[blockId].perArea = perArea;
    blocks[blockId].total = perArea * area;
    blocks[blockId].hhDays = bHh * area;
    blocks[blockId].hiredDays = bHired * area;
    total += perArea * area;
    hhDays += bHh * area;
    hiredDays += bHired * area;
    COMPONENTS.forEach(c => comps[c.id] += componentMonetary(rec, bs, c) * area);
  });

  // The questionnaire categories: productive area, plus farm administration as annual overhead.
  CATEGORIES.forEach(cat => {
    const cs = rec.categories[cat.id];
    const visible = isCategoryVisibleIn(rec, cat);
    const status = statusOfCategory(rec, cat.id);
    const perArea = visible ? categoryTotal(rec, cs) : 0;
    const catHh = visible ? categoryHouseholdDays(cs) : 0;
    const catHired = visible ? categoryHiredDays(cs) : 0;
    const mult = !useBlocks ? 1 : (status === "annual" ? 1 : (blocks.productive.area || 0));

    perCategory[cat.id] = {
      visible, status, mode: cs.mode,
      perArea, annual: perArea * mult,
      hhDays: catHh, hiredDays: catHired
    };
    if(!visible) return;

    blocks[status].perArea += perArea;
    blocks[status].total += perArea * mult;
    blocks[status].hhDays += catHh * mult;
    blocks[status].hiredDays += catHired * mult;

    total += perArea * mult;
    hhDays += catHh * mult;
    hiredDays += catHired * mult;
    COMPONENTS.forEach(c => comps[c.id] += componentMonetary(rec, cs, c) * mult);
  });

  const farmArea = totalFarmArea(rec);
  const productiveArea = num((rec.areas || {}).productive);
  const ratio = gbeRatioOf(rec);

  // Yield is quoted per unit of PRODUCTIVE area, the figure a farmer actually knows, so
  // production comes from that block alone. The cost it has to cover is the whole farm's,
  // including this year's new plantings, because that is what the harvest has to pay for.
  const production = useBlocks ? yieldOf(rec) * productiveArea : 0;
  const productionGbe = ratio > 0 ? production / ratio : 0;

  const perAreaCost = useBlocks ? (farmArea > 0 ? total / farmArea : 0) : total;
  const pricePres = useBlocks
    ? (production > 0 ? total / production : null)
    : pricePresOf(rec, total);
  const priceGbe = useBlocks
    ? (productionGbe > 0 ? total / productionGbe : null)
    : priceGbeOf(rec, total);

  return {
    useBlocks, blocks, perCategory,
    farmArea, productiveArea, production, productionGbe,
    total, perAreaCost,
    components: comps, hhDays, hiredDays,
    yieldPres: yieldOf(rec), yieldGbe: yieldGbeOf(rec),
    pricePres, priceGbe
  };
}

// Every itemised inputs / variable-cost line in one FGD, flattened. Used by the
// cross-FGD item comparison and by the detail CSV.
function itemLinesFor(rec){
  const lines = [];
  const push = (scopeLabel, blockId, catId, comp, e) => {
    if(!e) return;
    const value = num(e.value);
    const qty = num(e.qty);
    if(!value && !qty && !e.label && !e.code) return;
    lines.push({
      fgdId: rec.meta.id, fgdName: rec.fgdName, coopName: rec.coopName,
      country: rec.country || "", currency: (rec.currency || "").trim(),
      block: blockId, category: catId, component: comp.id,
      code: e.code || "", label: e.code ? catalogLabel(e.code) : (e.label || ""),
      qty: e.qty || "", unit: e.unit || "", value: e.value || ""
    });
  };
  const itemComps = COMPONENTS.filter(c => c.type === "currency" && !c.hasDepreciation);
  BLOCK_TABS.forEach(blockId => {
    itemComps.forEach(c => (rec.blockCosts[blockId][c.id] || []).forEach(e => push(null, blockId, "", c, e)));
  });
  CATEGORIES.forEach(cat => {
    if(!isCategoryVisibleIn(rec, cat)) return;
    const cs = rec.categories[cat.id];
    if(cs.mode !== "global") return;   // activity mode carries no per-item description
    itemComps.forEach(c => (cs.global[c.id] || []).forEach(e => push(null, statusOfCategory(rec, cat.id), cat.id, c, e)));
  });
  return lines;
}

function fmt(n){ return n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDays(n){ return n.toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function fmtPrice(v){ return v === null ? "—" : fmt(v); }
function fmtDate(iso){
  if(!iso) return "";
  try{
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }catch(e){ return iso; }
}

// Wrappers used by the questionnaire, which always works on the open record.
function yieldPerHa(){ return yieldOf(state); }
function gbeRatio(){ return gbeRatioOf(state); }
function yieldGbePerHa(){ return yieldGbeOf(state); }
function pricePerKgPresentation(total){ return pricePresOf(state, total); }
function pricePerKgGbe(total){ return priceGbeOf(state, total); }

// ==================== CONFIRMATION DIALOG ====================
// window.confirm() is unreliable in iOS browsers that are not Safari, so the
// confirmation is plain in-page HTML instead and behaves the same everywhere.
function showConfirm(message, okLabel, onConfirm){
  const overlay = document.getElementById("confirmModal");
  const okBtn = document.getElementById("confirmModalOk");
  const cancelBtn = document.getElementById("confirmModalCancel");
  document.getElementById("confirmModalMessage").textContent = message;
  okBtn.textContent = okLabel;
  cancelBtn.textContent = t("modal_cancel");
  overlay.style.display = "flex";
  function cleanup(){
    overlay.style.display = "none";
    okBtn.removeEventListener("click", onOk);
    cancelBtn.removeEventListener("click", onCancel);
    overlay.removeEventListener("click", onOverlay);
  }
  function onOk(){ cleanup(); onConfirm(); }
  function onCancel(){ cleanup(); }
  function onOverlay(e){ if(e.target === overlay) onCancel(); }
  okBtn.addEventListener("click", onOk);
  cancelBtn.addEventListener("click", onCancel);
  overlay.addEventListener("click", onOverlay);
}

// Accent- and case-insensitive, so a facilitator typing "cafe" on a phone keyboard
// still finds "Sol y Café". Several words are treated as AND, so "sol cusco" narrows
// rather than widens.
function normalizeSearch(v){
  return String(v === null || v === undefined ? "" : v)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}
function recordMatchesSearch(rec, needle){
  if(!needle) return true;
  const haystack = normalizeSearch([rec.fgdName, rec.coopName, rec.floId].join(" "));
  return needle.split(/\s+/).every(word => haystack.includes(word));
}

function sortedRecords(){
  return Object.values(records).sort((a,b) =>
    (b.meta.updatedAt || "").localeCompare(a.meta.updatedAt || ""));
}

function renderRecordsList(){
  const container = document.getElementById("recordsListContainer");
  const all = sortedRecords();
  const needle = normalizeSearch(recordSearch);
  const list = all.filter(rec => recordMatchesSearch(rec, needle));

  // No point offering a search box on an empty device, or a Clear button with
  // nothing to clear.
  document.getElementById("recordSearchBar").style.display = all.length ? "" : "none";
  document.getElementById("recordSearchClear").style.display = recordSearch ? "" : "none";

  if(!all.length){
    container.innerHTML = `
      <div class="empty-state records-empty">
        <h2>${esc(t("records_empty_title"))}</h2>
        <p>${esc(t("records_empty_body"))}</p>
        <button type="button" class="btn btn-save" data-new-record>${esc(t("btn_new_record"))}</button>
      </div>`;
    const btn = container.querySelector("[data-new-record]");
    if(btn) btn.addEventListener("click", createNewRecord);
    return;
  }

  if(!list.length){
    container.innerHTML = `
      <div class="empty-state">${esc(t("search_no_match"))}
        <a data-clear-search>${esc(t("search_clear_link"))}</a>
      </div>`;
    const link = container.querySelector("[data-clear-search]");
    if(link) link.addEventListener("click", clearRecordSearch);
    return;
  }
  const cards = list.map(rec => {
    const s = recordSummary(rec);
    const cur = rec.currency ? " " + esc(rec.currency) : "";
    const isCurrent = rec.meta.id === currentId;
    return `
      <div class="record-card ${isCurrent ? 'current' : ''}">
        <div class="record-card-main">
          <div class="record-card-title">${esc(rec.fgdName || t("untitled_fgd"))}</div>
          <div class="record-card-sub">${esc(rec.coopName || t("no_coop"))}${rec.floId ? " · " + esc(rec.floId) : ""}</div>
          <div class="record-card-total">${esc(t("kpi_total"))}: ${fmt(s.perAreaCost)}${cur} / ${esc(areaUnitOf(rec))}</div>
          <div class="record-card-date">${esc(t("col_updated"))}: ${esc(fmtDate(rec.meta.updatedAt))}${isCurrent ? " · " + esc(t("record_open_now")) : ""}</div>
        </div>
        <div class="record-card-actions">
          <button type="button" class="btn btn-primary btn-sm" data-open-record="${esc(rec.meta.id)}">${esc(t("btn_open_record"))}</button>
          <button type="button" class="btn btn-outline btn-sm" data-export-json="${esc(rec.meta.id)}">JSON</button>
          <button type="button" class="btn btn-outline btn-sm" data-export-csv="${esc(rec.meta.id)}">CSV</button>
          <button type="button" class="btn-icon" data-delete-record="${esc(rec.meta.id)}" title="${esc(t("btn_delete_record"))}">&times;</button>
        </div>
      </div>`;
  }).join("");
  const countText = needle
    ? t("records_count_filtered").replace("{n}", list.length).replace("{total}", all.length)
    : list.length + " " + t("records_count_suffix");
  container.innerHTML = `
    <p class="records-count">${esc(countText)}</p>
    <div class="records-list">${cards}</div>`;

  container.querySelectorAll("[data-open-record]").forEach(b =>
    b.addEventListener("click", () => openRecord(b.getAttribute("data-open-record"))));
  container.querySelectorAll("[data-export-json]").forEach(b =>
    b.addEventListener("click", () => exportRecordJson(records[b.getAttribute("data-export-json")])));
  container.querySelectorAll("[data-export-csv]").forEach(b =>
    b.addEventListener("click", () => exportRecordsCsv([records[b.getAttribute("data-export-csv")]], false)));
  container.querySelectorAll("[data-delete-record]").forEach(b =>

function openRecord(id){
  if(!records[id]) return;
  currentId = id;
  state = records[id];
  screen = "editor";
  applyScreen();
  fillSetupFields();
  refreshUnitLabels();
  refreshBlockTabVisibility();
  renderActivitiesTab();
  renderQuestionnaireTab();
  const wanted = state.activeTab || "activities";
  const blockOk = BLOCK_TABS.some(b => "block_" + b === wanted && num(state.areas[b]) > 0);
  switchTab(blockOk || wanted === "questionnaire" ? wanted : "activities");
  setSaveStatus(t("save_status_auto"));
  window.scrollTo(0, 0);
}

function createNewRecord(){
  const rec = defaultRecord();
  records[rec.meta.id] = rec;
  persistAllRecords(records);
  openRecord(rec.meta.id);
}

function deleteRecord(id){
  showConfirm(t("confirm_delete_record"), t("modal_delete"), () => {
    delete records[id];
    persistAllRecords(records);
    if(currentId === id){ currentId = null; state = null; screen = "list"; }
    goToRecordsList();
  });
}

function deleteAllRecords(){
  showConfirm(t("confirm_delete_all"), t("modal_delete"), () => {
    records = {};
    currentId = null;
    state = null;
    persistAllRecords(records);
    screen = "list";
    compareFilters = { presentation: "", currency: "", areaUnit: "" };
    recordSearch = "";
    document.getElementById("recordSearch").value = "";
    goToRecordsList();
  });
}

function renderActivitiesTab(){
  if(!state) return;
  const container = document.getElementById("activityGroupsContainer");
  container.innerHTML = ACTIVITY_GROUPS.map(group => {
    const selected = state.selectedActivities[group.id] || [];
    return `
      <div class="activity-group-card">
        <h3>${esc(t(group.titleKey))}</h3>
        <div class="group-desc">${esc(t(group.descKey))}</div>
        <div class="activity-choices">
          ${group.options.map(opt => {
            const checked = selected.includes(opt.value);
            return `
              <label class="activity-choice ${checked ? 'checked' : ''}">
                <input type="checkbox" data-activity-group="${group.id}" data-activity-value="${opt.value}" ${checked ? 'checked' : ''}>
                ${esc(t(opt.labelKey))}
              </label>`;
          }).join("")}
        </div>
      </div>`;
  }).join("");

  container.querySelectorAll("input[data-activity-group]").forEach(input => {
    input.addEventListener("change", () => {
      const group = input.getAttribute("data-activity-group");
      const value = input.getAttribute("data-activity-value");
      const arr = state.selectedActivities[group] || (state.selectedActivities[group] = []);
      const idx = arr.indexOf(value);
      if(input.checked && idx === -1) arr.push(value);
      if(!input.checked && idx !== -1) arr.splice(idx, 1);
      saveState();
      renderActivitiesTab();
      renderQuestionnaireTab();
    });
  });
}

// A "scope" is either a questionnaire category ("cat:harvest") or one of the two flat
// block tabs ("blk:establishment"). Both hold the same entry shapes, so one renderer serves
// the questionnaire and the establishment / renovation tabs.
function scopeEntries(scope, compId){
  const [kind, id] = scope.split(":");
  return kind === "blk" ? state.blockCosts[id][compId] : state.categories[id].global[compId];
}
function scopePath(scope, compId, i, field){
  const [kind, id] = scope.split(":");
  return kind === "blk"
    ? `blockCosts.${id}.${compId}.${i}.${field}`
    : `categories.${id}.global.${compId}.${i}.${field}`;
}
function scopeExampleCat(scope){
  const [kind, id] = scope.split(":");
  return kind === "blk" ? null : id;   // block tabs use the generic examples
}
function scopeUnitSuffix(scope){
  const [kind, id] = scope.split(":");
  if(kind === "blk") return ti("unit_per_area");
  return unitSuffixForCat(id);
}

function itemPickerHtml(scope, comp, i, entry){
  const items = catalogFor(state, comp.id);
  const isOther = !entry.code;
  const opts = items.map(it =>
    `<option value="${esc(it.code)}" ${entry.code === it.code ? "selected" : ""}>${esc(it.label)}</option>`).join("");
  return `
    <select class="item-select" data-path="${scopePath(scope, comp.id, i, 'code')}">
      <option value="" ${isOther ? "selected" : ""}>${esc(t("item_other"))}</option>
      ${opts}

    ${isOther ? `<input type="text" class="item-other" placeholder="${esc(t('ph_description_generic'))}" data-path="${scopePath(scope, comp.id, i, 'label')}" value="${esc(entry.label)}">` : ""}`;
}

  const entries = scopeEntries(scope, comp.id);

  const exCat = scopeExampleCat(scope);

  let subtotalHtml;
  if(comp.hasDepreciation){
    subtotalHtml = fmt(entries.reduce((s,e) => s + depreciatedAnnualCost(e), 0));
  } else if(comp.type === "currency"){
    subtotalHtml = fmt(entries.reduce((s,e) => s + num(e.value), 0));
  } else if(comp.hasContractOption){
    const cost = entries.reduce((s,e) => s + (e.entryType === "lumpsum" ? num(e.value) : num(e.days) * wage()), 0);
    const days = entries.reduce((s,e) => s + (e.entryType === "lumpsum" ? 0 : num(e.days)), 0);
    subtotalHtml = `${fmt(cost)}<span class="c-subtotal-days">${fmtDays(days)} ${esc(t("ph_days"))}</span>`;

    subtotalHtml = `${fmt(days * wage())}<span class="c-subtotal-days">${fmtDays(days)} ${esc(t("ph_days"))}</span>`;

    const removeBtn = entries.length > 1
      ? `<button type="button" class="remove-btn" data-remove-entry="${scope}|${comp.id}" data-index="${i}" title="${esc(t('remove_btn_title'))}">&times;</button>`
      : `<span style="width:22px;display:inline-block;"></span>`;

      const annual = depreciatedAnnualCost(entry);
      return `
        <div class="entry-row">
          <input type="text" placeholder="${esc(t('ph_tool_equipment'))}" data-path="${scopePath(scope, comp.id, i, 'label')}" value="${esc(entry.label)}">

          <span class="computed-cost" data-entry-cost="${scope}|${comp.id}|${i}">${fmt(annual)}${esc(t("unit_per_year"))}</span>
          ${removeBtn}
        </div>`;
    } else if(comp.type === "currency"){
      // Item picker, then an optional quantity and unit, then the money. Quantity and unit
      // are what a footprint calculation would need later; money alone cannot give it.
      return `
        <div class="entry-row entry-row-item">
          <div class="item-cell">${itemPickerHtml(scope, comp, i, entry)}</div>
          <div class="qty-cell">
            <input type="number" step="any" min="0" placeholder="${esc(t('ph_qty'))}" data-path="${scopePath(scope, comp.id, i, 'qty')}" value="${esc(entry.qty)}">
            <select data-path="${scopePath(scope, comp.id, i, 'unit')}">
              <option value="">${esc(t("unit_none"))}</option>

            </select>
            <input type="number" step="any" min="0" placeholder="0.00" data-path="${scopePath(scope, comp.id, i, 'value')}" value="${esc(entry.value)}">
            ${removeBtn}
          </div>
        </div>`;
    } else if(comp.hasContractOption){
      const isLumpsum = entry.entryType === "lumpsum";
      const entryCost = isLumpsum ? num(entry.value) : num(entry.days) * wage();
      return `
        <div class="entry-row">
          <div class="entry-type-toggle" data-entry-type-toggle="${scope}|${comp.id}|${i}">
            <button type="button" class="${!isLumpsum ? 'active' : ''}" data-entry-type="days">${esc(t('entrytype_days'))}</button>
            <button type="button" class="${isLumpsum ? 'active' : ''}" data-entry-type="lumpsum">${esc(t('entrytype_lumpsum'))}</button>
          </div>
          <input type="text" placeholder="${esc(t('ph_description_generic') + ' (' + ex.labour + ')')}" data-path="${scopePath(scope, comp.id, i, 'label')}" value="${esc(entry.label)}">
          ${isLumpsum
            ? `<input type="number" step="any" min="0" placeholder="${esc(t('ph_fixed_amount'))}" data-path="${scopePath(scope, comp.id, i, 'value')}" value="${esc(entry.value)}">`
            : `<input type="number" step="any" min="0" placeholder="${esc(t('ph_days'))}" data-path="${scopePath(scope, comp.id, i, 'days')}" value="${esc(entry.days)}">`
          }
          <span class="computed-cost" data-entry-cost="${scope}|${comp.id}|${i}">${fmt(entryCost)}</span>
          ${removeBtn}
        </div>`;
    } else {
      const entryCost = comp.costed ? num(entry.days) * wage() : 0;
      return `
        <div class="entry-row">
          <input type="text" placeholder="${esc(t('ph_description_generic') + ' (' + ex.labour + ')')}" data-path="${scopePath(scope, comp.id, i, 'label')}" value="${esc(entry.label)}">
          <input type="number" step="any" min="0" placeholder="${esc(t('ph_days'))}" data-path="${scopePath(scope, comp.id, i, 'days')}" value="${esc(entry.days)}">

    }
  }).join("");

  return `
    <div class="component-block ${comp.type === 'days' && !comp.costed ? 'not-costed' : ''}" data-component="${comp.id}">
      <div class="component-block-head">
        <span class="c-name">${esc(t(comp.labelKey))}${hintHtml}</span>

}
