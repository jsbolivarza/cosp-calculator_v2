          <span class="cat-total">${fmt(total)}</span>
        </div>
      </div>
      <div class="cat-body ${cs.open ? 'open' : ''}" data-body="${cat.id}">
        ${globalActive ? `
          ${componentsForCategory(cat).map(c => globalComponentHtml("cat:" + cat.id, c, cs)).join("")}
        ` : `
          <div data-activities="${cat.id}">
            ${cs.activities.map((act, i) => `
              <div class="activity-row" data-activity-index="${i}">
                <div class="activity-top">
                  <input type="text" placeholder="${esc(t('ph_activity_name') + ' ' + categoryExamples(cat.id).activity + ')')}"
                    data-path="categories.${cat.id}.activities.${i}.name" value="${esc(act.name)}">
                  ${cs.activities.length > 1 ? `<button type="button" class="activity-remove" data-remove-activity="${cat.id}" data-index="${i}">${esc(t('remove_btn_title'))}</button>` : ''}
                </div>
                ${activityComponentFieldsHtml(cat.id, i, act)}
              </div>
            `).join("")}
          </div>
          <button type="button" class="add-activity-btn" data-add-activity="${cat.id}">${esc(t("add_activity_btn"))}</button>
        `}
        <div class="subtotal-line">
          ${esc(t("subtotal_prefix"))} ${esc(t(cat.labelKey))}: <strong data-cat-subtotal="${cat.id}">${fmt(total)}</strong> ${esc(status === "annual" ? ti("subtotal_unit_annual") : ti("subtotal_unit"))}
          <span class="note" data-cat-note="${cat.id}">${esc(t("subtotal_note"))} ${fmtDays(hhDays)} ${esc(t("subtotal_note_mid"))} ${fmtDays(hiredDays)} ${esc(t("subtotal_note_wage"))} ${fmt(wage())})</span>
        </div>
      </div>
    </div>`;
  }).join("");

  attachCategoryListeners(container);
}

function attachCategoryListeners(root){
  root.querySelectorAll("[data-toggle-open]").forEach(el => {
    el.addEventListener("click", (e) => {
      if(e.target.closest("[data-mode-toggle]")) return;
      const id = el.getAttribute("data-toggle-open");
      state.categories[id].open = !state.categories[id].open;
      renderCategories();
      updateTotalsOnly();
    });
  });

  root.querySelectorAll("[data-mode-toggle]").forEach(group => {
    group.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = group.getAttribute("data-mode-toggle");
        state.categories[id].mode = btn.getAttribute("data-mode");
        state.categories[id].open = true;
        saveState();
        renderCategories();
        updateTotalsOnly();
      });
    });
  });

  root.querySelectorAll("[data-add-activity]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-add-activity");
      state.categories[id].activities.push({ name: "", ...emptyActivityComponents() });
      saveState();
      renderCategories();
      updateTotalsOnly();
    });
  });

  root.querySelectorAll("[data-remove-activity]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-remove-activity");
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      state.categories[id].activities.splice(idx, 1);
      saveState();
      renderCategories();
      updateTotalsOnly();
    });
  });

  root.querySelectorAll("[data-add-entry]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [scope, compId] = btn.getAttribute("data-add-entry").split("|");
      scopeEntries(scope, compId).push(emptyEntry(COMPONENTS.find(c => c.id === compId)));
      saveState();
      renderActiveCostTabs();
    });
  });

  root.querySelectorAll("[data-remove-entry]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [scope, compId] = btn.getAttribute("data-remove-entry").split("|");
      scopeEntries(scope, compId).splice(parseInt(btn.getAttribute("data-index"), 10), 1);
      saveState();
      renderActiveCostTabs();
    });
  });

  root.querySelectorAll("[data-entry-type-toggle]").forEach(group => {
    group.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const [scope, compId, idx] = group.getAttribute("data-entry-type-toggle").split("|");
        scopeEntries(scope, compId)[parseInt(idx,10)].entryType = btn.getAttribute("data-entry-type");
        saveState();
        renderActiveCostTabs();
      });
    });
  });

  root.querySelectorAll("[data-entry-type-toggle-activity]").forEach(group => {
    group.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        const [catId, actIdx, compId] = group.getAttribute("data-entry-type-toggle-activity").split("|");
        state.categories[catId].activities[parseInt(actIdx,10)][compId].entryType = btn.getAttribute("data-entry-type");
        saveState();
        renderCategories();
        updateTotalsOnly();
      });
    });
  });

  bindPathInputs(root);
}

// Text and number boxes patch the totals in place so typing never loses focus. Dropdowns
// change the shape of the row (picking "Other" reveals a free-text box), so they redraw.
function bindPathInputs(root){
  root.querySelectorAll("[data-path]").forEach(el => {
    if(el.tagName === "SELECT"){
      el.addEventListener("change", () => {
        setByPath(state, el.getAttribute("data-path"), el.value);
        saveState();
        renderActiveCostTabs();
      });
    }else{
      el.addEventListener("input", () => {
        setByPath(state, el.getAttribute("data-path"), el.value);
        saveState();
        updateTotalsOnly();
      });
    }
  });
}

// ---- Tabs 2 and 3: establishment and renovation, Tier 3 questions only ----
function renderBlockTabs(){

function setByPath(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){
    const key = isNaN(parts[i]) ? parts[i] : parseInt(parts[i],10);
    cur = cur[key];
  }
  const lastKey = isNaN(parts[parts.length-1]) ? parts[parts.length-1] : parseInt(parts[parts.length-1],10);
  cur[lastKey] = value;
}

function updateTotalsOnly(){
  if(!state) return;
  let grand = 0;
  let hhDaysGrand = 0;
  let hiredDaysGrand = 0;
  const grandComponents = {};
  COMPONENTS.forEach(c => grandComponents[c.id] = 0);

  visibleCategories().forEach(cat => {
    const cs = state.categories[cat.id];
    const total = categoryTotal(state, cs);
    const hhDays = categoryHouseholdDays(cs);
    const hiredDays = categoryHiredDays(cs);
    grand += total;
    hhDaysGrand += hhDays;
    hiredDaysGrand += hiredDays;
    COMPONENTS.forEach(c => grandComponents[c.id] += componentMonetary(state, cs, c));

    document.querySelectorAll(`.category[data-cat="${cat.id}"] .cat-total`).forEach(el => el.textContent = fmt(total));
    const subEl = document.querySelector(`[data-cat-subtotal="${cat.id}"]`);
    if(subEl) subEl.textContent = fmt(total);
    const noteEl = document.querySelector(`[data-cat-note="${cat.id}"]`);
    if(noteEl) noteEl.textContent = `${t("subtotal_note")} ${fmtDays(hhDays)} ${t("subtotal_note_mid")} ${fmtDays(hiredDays)} ${t("subtotal_note_wage")} ${fmt(wage())})`;

    if(cs.mode === "global"){
      COMPONENTS.forEach(comp => {
        const el = document.querySelector(`[data-component-subtotal="cat:${cat.id}|${comp.id}"]`);
        if(!el) return;
        const entries = cs.global[comp.id];
        if(comp.hasDepreciation){
          el.textContent = fmt(entries.reduce((s,e) => s + depreciatedAnnualCost(e), 0));
        } else if(comp.type === "currency"){
          el.textContent = fmt(entries.reduce((s,e) => s + num(e.value), 0));
        } else if(comp.hasContractOption){
          const cost = entries.reduce((s,e) => s + (e.entryType === "lumpsum" ? num(e.value) : num(e.days) * wage()), 0);
          const days = entries.reduce((s,e) => s + (e.entryType === "lumpsum" ? 0 : num(e.days)), 0);
          el.innerHTML = `${fmt(cost)}<span class="c-subtotal-days">${fmtDays(days)} ${esc(t("ph_days"))}</span>`;
        } else if(comp.costed){
          const days = entries.reduce((s,e) => s + num(e.days), 0);
          el.innerHTML = `${fmt(days * wage())}<span class="c-subtotal-days">${fmtDays(days)} ${esc(t("ph_days"))}</span>`;
        } else {
          const days = entries.reduce((s,e) => s + num(e.days), 0);
          el.textContent = `${fmtDays(days)} ${t("ph_days")}`;
        }

        entries.forEach((entry, i) => {
          const costEl = document.querySelector(`[data-entry-cost="cat:${cat.id}|${comp.id}|${i}"]`);
          if(!costEl) return;
          if(comp.hasDepreciation){
            costEl.textContent = fmt(depreciatedAnnualCost(entry)) + t("unit_per_year");
          } else if(comp.hasContractOption){
            costEl.textContent = fmt(entry.entryType === "lumpsum" ? num(entry.value) : num(entry.days) * wage());
          } else if(comp.type === "days" && comp.costed){
            costEl.textContent = fmt(num(entry.days) * wage());
          }
        });
      });
    } else {
      cs.activities.forEach((act, i) => {
        const hiredComp = COMPONENTS.find(c => c.hasContractOption);
        if(hiredComp){
          const entry = act[hiredComp.id] || {};
          const el = document.querySelector(`[data-activity-cost="${cat.id}|${i}|${hiredComp.id}"]`);
          if(el) el.textContent = `${t("cost_colon")} ${fmt(entry.entryType === "lumpsum" ? num(entry.value) : num(entry.days) * wage())} ${unitSuffixForCat(cat.id)}`;
        }
        const fixedComp = COMPONENTS.find(c => c.hasDepreciation);
        if(fixedComp){
          const entry = act[fixedComp.id] || {};
          const el = document.querySelector(`[data-activity-cost="${cat.id}|${i}|${fixedComp.id}"]`);
          if(el) el.textContent = fmt(depreciatedAnnualCost(entry)) + t("unit_per_year");
        }
      });
    }
  });

  const S = recordSummary(state);
  renderHeadline(S);
  renderLandCard(S);
  renderSummaryTable(S);
}

// Three headline figures, then one compact strip. Previously this was seven KPI cards plus
// a seven-cell results card that repeated two of them.
function renderHeadline(S){
  const c = currencyOf(state);
  const u = areaUnitOf(state);
  const card = (cls, label, value, unit) => `
    <div class="kpi-card ${cls}">
      <div class="kpi-label">${esc(label)}</div>
      <div class="kpi-value">${esc(value)}${unit ? ` <small>${esc(unit)}</small>` : ""}</div>
    </div>`;
  document.getElementById("headlineGrid").innerHTML =
      card("night", S.useBlocks ? t("kpi_total_annual") : t("kpi_total"),
           fmt(S.total), S.useBlocks ? c : ti("kpi_total_unit"))
    + card("eggplant", t("th_price_pres"), fmtPrice(S.pricePres), c + "/kg")
    + card("mint", t("th_price_gbe"), fmtPrice(S.priceGbe), c + "/kg GBE");

  const item = (label, value) => `<div class="d-item"><div class="d-label">${esc(label)}</div><div class="d-value">${esc(value)}</div></div>`;
  let strip = "";
  if(S.useBlocks){
    strip += item(t("res_farm_area"), fmtDays(S.farmArea) + " " + u);
    strip += item(t("res_production"), fmtDays(S.production) + " kg");
    strip += item(t("res_cost_per_area"), fmt(S.perAreaCost));
  }
  strip += item(t("kpi_inputs"), fmt(S.components.inputs));
  strip += item(t("kpi_variable"), fmt(S.components.variable));
  strip += item(t("kpi_fixed"), fmt(S.components.fixed));
  strip += item(t("kpi_hired_cost"), fmt(S.components.hired));
  strip += item(t("kpi_household_days"), fmtDays(S.hhDays));
  strip += item(t("kpi_hired_days"), fmtDays(S.hiredDays));
  document.getElementById("detailStrip").innerHTML = strip;
}

// ---- Tab 1: land block card ----
function renderLandCard(S){
  if(!state) return;
  const sum = S || recordSummary(state);
  const u = areaUnitOf(state);
  document.getElementById("areaTotalDisplay").value =
    (sum.farmArea > 0 ? fmtDays(sum.farmArea) : "0.0") + " " + u;
  const bar = document.getElementById("landBar");
  const legend = document.getElementById("landLegend");
  const colours = { establishment: "var(--eggplant)", renovation: "var(--tangerine)", productive: "var(--mint-dark)" };
  const areaStatuses = LAND_STATUSES.filter(st => st.areaKey);
  if(sum.farmArea > 0){
    bar.style.display = "flex";
    bar.innerHTML = areaStatuses.map(st => {
      const pct = (sum.blocks[st.id].area / sum.farmArea) * 100;
      return `<div style="width:${pct}%; background:${colours[st.id]};"></div>`;
    }).join("");
    legend.innerHTML = areaStatuses.map(st => {
      const pct = Math.round((sum.blocks[st.id].area / sum.farmArea) * 100);
      return `<span><i style="background:${colours[st.id]}"></i>${esc(t(st.labelKey))} ${pct}%</span>`;
    }).join("");
  }else{
    bar.style.display = "none";
    legend.innerHTML = "";
  }
  document.getElementById("landNote").textContent = sum.farmArea > 0 ? t("land_note_active") : t("land_note_blank");
}

// data-label on every cell drives the stacked card layout on phones (see the
// max-width:700px rules). It has no effect on wide screens.
// The columns differ between the two modes, so the header is built here rather than
// sitting static in the markup.
function renderSummaryTable(S){
  if(!state) return;
  const sum = S || recordSummary(state);
  const table = document.getElementById("summaryTable");
  const thead = table.querySelector("thead");
  const tbody = table.querySelector("tbody");
  const cats = visibleCategories();

  const cols = sum.useBlocks
    ? [ t("th_category"), t("th_status"), t("th_hh_days"), t("th_hired_days"), t("th_cost_per_area"), t("th_annual_cost") ]
    : [ t("th_category"), t("th_mode"), t("th_hh_days"), t("th_hired_days"), ti("th_total"), t("th_price_pres"), t("th_price_gbe") ];
  const numeric = sum.useBlocks ? [2,3,4,5] : [2,3,4,5,6];
  thead.innerHTML = `<tr>${cols.map((c,i) =>
    `<th class="${numeric.includes(i) ? 'num' : ''}">${esc(c)}</th>`).join("")}</tr>`;

  const cell = (i, value, extraClass) =>
    `<td class="${numeric.includes(i) ? 'num' : ''} ${extraClass || ''}" data-label="${esc(cols[i])}">${value}</td>`;
  const head = (value, extraClass) =>
    `<td class="row-head ${extraClass || ''}" data-label="${esc(cols[0])}">${value}</td>`;

  if(!cats.length){
    tbody.innerHTML = `<tr><td colspan="${cols.length}" style="color:var(--grey);">${esc(t("empty_summary"))}</td></tr>`;
    return;
  }

  let html = "";

  if(sum.useBlocks){
    // Grouped by land block, with a subtotal under each. No allocation happens between
    // blocks: the subtotals are simply added up.
    LAND_STATUSES.forEach(st => {
      if(BLOCK_TABS.includes(st.id)){
        const b = sum.blocks[st.id];
        if(!b.area && !b.total) return;
        html += `<tr class="block-row">
          ${head(esc(t(st.labelKey)) + ` (${fmtDays(b.area)} ${esc(areaUnitOf(state))})`)}
          ${cell(1, esc(t("block_flat_note")))}
          ${cell(2, fmtDays(b.hhDays))}
          ${cell(3, fmtDays(b.hiredDays))}
          ${cell(4, fmt(b.perArea))}
          ${cell(5, fmt(b.total))}
        </tr>`;
        return;
      }
      const inBlock = cats.filter(cat => sum.perCategory[cat.id].status === st.id);
      if(!inBlock.length) return;
      inBlock.forEach(cat => {
        const pc = sum.perCategory[cat.id];
        html += `<tr>
          ${head(esc(t(cat.labelKey)))}
          ${cell(1, esc(t(st.labelKey)))}
          ${cell(2, fmtDays(pc.hhDays))}
          ${cell(3, fmtDays(pc.hiredDays))}
          ${cell(4, st.areaKey ? fmt(pc.perArea) : "\u2014")}
          ${cell(5, fmt(pc.annual))}
        </tr>`;
      });
      const b = sum.blocks[st.id];
      const areaText = st.areaKey ? ` (${fmtDays(b.area)} ${esc(areaUnitOf(state))})` : "";
      html += `<tr class="block-row">
        ${head(esc(t("subtotal_block") + " " + t(st.labelKey)) + areaText)}
        ${cell(1, "", "empty-cell")}
        ${cell(2, fmtDays(b.hhDays))}
        ${cell(3, fmtDays(b.hiredDays))}
        ${cell(4, st.areaKey ? fmt(b.perArea) : "\u2014")}
        ${cell(5, fmt(b.total))}
      </tr>`;
    });
    html += `<tr class="total-row">
      ${head(esc(t("res_total_annual")))}
      ${cell(1, "", "empty-cell")}
      ${cell(2, fmtDays(sum.hhDays))}
      ${cell(3, fmtDays(sum.hiredDays))}
      ${cell(4, "", "empty-cell")}
      ${cell(5, fmt(sum.total))}
    </tr>`;
  }else{
    cats.forEach(cat => {
      const pc = sum.perCategory[cat.id];
      html += `<tr>
        ${head(esc(t(cat.labelKey)))}
        ${cell(1, esc(pc.mode === "global" ? t("mode_global") : t("mode_activity")))}
        ${cell(2, fmtDays(pc.hhDays))}
        ${cell(3, fmtDays(pc.hiredDays))}
        ${cell(4, fmt(pc.perArea))}
        ${cell(5, fmtPrice(pricePerKgPresentation(pc.perArea)))}
        ${cell(6, fmtPrice(pricePerKgGbe(pc.perArea)))}
      </tr>`;
    });
    html += `<tr class="total-row">
      ${head(esc(t("total_cps_row")))}
      ${cell(1, "", "empty-cell")}
      ${cell(2, fmtDays(sum.hhDays))}
      ${cell(3, fmtDays(sum.hiredDays))}
      ${cell(4, fmt(sum.total))}
      ${cell(5, fmtPrice(sum.pricePres))}
      ${cell(6, fmtPrice(sum.priceGbe))}
    </tr>`;
  }

  tbody.innerHTML = html;
}

// ==================== TAB 3: COMPARISON ACROSS FGDs ====================

function renderCompareTab(){
  const container = document.getElementById("compareContainer");
  const all = sortedRecords();
  if(all.length < 2){
    container.innerHTML = `<div class="empty-state">${esc(t("compare_need_more"))}</div>`;
    return;
  }

  // Filter options are built from the FGDs actually on the device, so the dropdowns
  // never offer a currency or coffee type nobody captured.
  const presOptions = [...new Set(all.map(r => r.presentation))];
  const curOptions  = [...new Set(all.map(r => (r.currency || "").trim()))].filter(Boolean);
  const unitOptions = [...new Set(all.map(r => areaUnitOf(r)))];

  // Drop any filter value that no longer exists (e.g. after deleting an FGD).
  if(compareFilters.presentation && !presOptions.includes(compareFilters.presentation)) compareFilters.presentation = "";
  if(compareFilters.currency && !curOptions.includes(compareFilters.currency)) compareFilters.currency = "";
  if(compareFilters.areaUnit && !unitOptions.includes(compareFilters.areaUnit)) compareFilters.areaUnit = "";

  const list = all.filter(r =>
    (!compareFilters.presentation || r.presentation === compareFilters.presentation) &&
    (!compareFilters.currency || (r.currency || "").trim() === compareFilters.currency) &&
    (!compareFilters.areaUnit || areaUnitOf(r) === compareFilters.areaUnit));

  const hasFilter = compareFilters.presentation || compareFilters.currency || compareFilters.areaUnit;
  const sel = (id, label, options, current, labelFn) => `
    <div class="field">
      <label>${esc(label)}</label>
      <select data-compare-filter="${id}">
        <option value="">${esc(t("filter_all"))}</option>
        ${options.map(o => `<option value="${esc(o)}" ${o === current ? "selected" : ""}>${esc(labelFn ? labelFn(o) : o)}</option>`).join("")}
      </select>
    </div>`;
  const filterBar = `
    <div class="filter-bar">
      ${sel("presentation", t("filter_presentation"), presOptions, compareFilters.presentation, presentationLabel)}
      ${sel("currency", t("filter_currency"), curOptions, compareFilters.currency)}
      ${sel("areaUnit", t("filter_area_unit"), unitOptions, compareFilters.areaUnit)}
      ${hasFilter ? `<button type="button" class="btn btn-outline btn-sm filter-reset" data-compare-filter-reset>${esc(t("filter_reset"))}</button>` : ""}
    </div>`;

  function wireFilters(){
    container.querySelectorAll("[data-compare-filter]").forEach(el => {
      el.addEventListener("change", () => {
        compareFilters[el.getAttribute("data-compare-filter")] = el.value;
        renderCompareTab();
      });
    });
    const reset = container.querySelector("[data-compare-filter-reset]");
    if(reset) reset.addEventListener("click", () => {
      compareFilters = { presentation: "", currency: "", areaUnit: "" };
      renderCompareTab();
    });
  }

  if(!list.length){
    container.innerHTML = filterBar + `<div class="empty-state">${esc(t("compare_no_match"))}</div>`;
    wireFilters();
    return;
  }

  // A kilo of cherry and a kilo of parchment are different things, so averaging yield
  // or price per kg across coffee types produces a number that means nothing. Same for
  // money across currencies or area units. Those averages are blanked rather than shown,
  // because a facilitator who never touches the filters should not be handed a wrong figure.
  const mixedPresentation = new Set(list.map(r => r.presentation)).size > 1;
  const mixedUnits = new Set(list.map(r => (r.currency || "").trim().toUpperCase() + "|" + areaUnitOf(r))).size > 1;
  // Some FGDs may predate land blocks and have no areas at all. Averaging farm area or
  // annual cost over only the ones that have them, under a row labelled with the full
  // count, would quietly understate both. Blank them instead.
  const mixedBasis = new Set(list.map(r => usesBlocks(r))).size > 1;

  const summaries = list.map(r => ({ rec: r, s: recordSummary(r) }));
  const avg = (pick) => {
    const vals = summaries.map(pick).filter(v => v !== null && v !== undefined && isFinite(v));
    return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
  };
  const avgNum   = (pick, suppressed) => suppressed ? "—" : fmt(avg(pick) || 0);
  const avgDays  = (pick, suppressed) => suppressed ? "—" : fmtDays(avg(pick) || 0);
  const avgPrice = (pick, suppressed) => suppressed ? "—" : fmtPrice(avg(pick));

  const rows = summaries.map(({rec, s}) => `
    <tr>
      <td class="row-head" data-label="${esc(t("th_fgd"))}">${esc(rec.fgdName || t("untitled_fgd"))}</td>
      <td data-label="${esc(t("th_coop"))}">${esc(rec.coopName || "—")}</td>

// ==================== INPUTS AND VARIABLE COSTS ACROSS FGDs ====================
let itemFilters = { country: "", component: "inputs" };

function renderItemsTab(){
  const container = document.getElementById("itemsContainer");
  const all = sortedRecords();
  if(!all.length){
    container.innerHTML = `<div class="empty-state">${esc(t("records_empty_title"))}</div>`;
    return;
  }
  const countryOptions = [...new Set(all.map(r => r.country).filter(Boolean))];
  if(itemFilters.country && !countryOptions.includes(itemFilters.country)) itemFilters.country = "";

  const scoped = all.filter(r => !itemFilters.country || r.country === itemFilters.country);
  const lines = scoped.flatMap(itemLinesFor).filter(l => l.component === itemFilters.component);

  const countryName = code => (COUNTRIES.find(c => c.code === code) || {}).name || code;
  const filterBar = `
    <div class="filter-bar">
      <div class="field">
        <label>${esc(t("filter_country"))}</label>
        <select data-item-filter="country">
          <option value="">${esc(t("filter_all"))}</option>
          ${countryOptions.map(c => `<option value="${esc(c)}" ${c === itemFilters.country ? "selected" : ""}>${esc(countryName(c))}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>${esc(t("filter_component"))}</label>
        <select data-item-filter="component">
          <option value="inputs" ${itemFilters.component === "inputs" ? "selected" : ""}>${esc(t("comp_inputs"))}</option>
          <option value="variable" ${itemFilters.component === "variable" ? "selected" : ""}>${esc(t("comp_variable"))}</option>
        </select>
      </div>
      <button type="button" class="btn btn-outline btn-sm filter-reset" data-items-csv>${esc(t("btn_export_items_csv"))}</button>
    </div>`;

  function wire(){
    container.querySelectorAll("[data-item-filter]").forEach(el =>
      el.addEventListener("change", () => { itemFilters[el.getAttribute("data-item-filter")] = el.value; renderItemsTab(); }));
    const csv = container.querySelector("[data-items-csv]");
    if(csv) csv.addEventListener("click", exportItemDetailCsv);
  }

  if(!lines.length){
    container.innerHTML = filterBar + `<div class="empty-state">${esc(t("items_none"))}</div>`;
    wire();
    return;
  }

  // Group by catalogue code where there is one; fall back to the typed text otherwise, which
  // is exactly why the catalogue exists: free text fragments into near-duplicates.
  const groups = {};
  lines.forEach(l => {
    const key = l.code || ("free:" + normalizeSearch(l.label));
    const g = groups[key] || (groups[key] = { label: l.label || t("item_unnamed"), coded: !!l.code, fgds: new Set(), values: [], qtys: [], units: new Set() });
    g.fgds.add(l.fgdId);
    if(num(l.value)) g.values.push(num(l.value));
    if(num(l.qty)){ g.qtys.push(num(l.qty)); if(l.unit) g.units.add(l.unit); }
  });
  const rows = Object.values(groups).map(g => {
    const sum = g.values.reduce((a,b) => a+b, 0);
    return { label: g.label, coded: g.coded, fgds: g.fgds.size, sum,
             avg: g.values.length ? sum / g.values.length : 0,
             min: g.values.length ? Math.min(...g.values) : 0,
             max: g.values.length ? Math.max(...g.values) : 0,
             qtyAvg: g.qtys.length ? g.qtys.reduce((a,b)=>a+b,0) / g.qtys.length : null,
             unit: g.units.size === 1 ? [...g.units][0] : (g.units.size > 1 ? "mixed" : "") };
  }).sort((a,b) => b.sum - a.sum);
  const grand = rows.reduce((s,r) => s + r.sum, 0);
  const mixedCurrency = new Set(scoped.map(r => (r.currency || "").toUpperCase()).filter(Boolean)).size > 1;

  container.innerHTML = filterBar
    + (mixedCurrency ? `<div class="warn-note">${esc(t("items_mixed_currency"))}</div>` : "")
    + `<div class="table-card" style="margin-top:0;">
      <table class="dt">
        <thead><tr>
          <th>${esc(t("th_item"))}</th>
          <th class="num">${esc(t("th_fgd_count"))}</th>
          <th class="num">${esc(t("th_avg_qty"))}</th>
          <th class="num">${esc(t("th_avg_cost"))}</th>
          <th class="num">${esc(t("th_range"))}</th>
          <th class="num">${esc(t("th_share"))}</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td class="row-head" data-label="${esc(t("th_item"))}">${esc(r.label)}${r.coded ? "" : ` <span class="c-hint">(${esc(t("item_free_text"))})</span>`}</td>
            <td class="num" data-label="${esc(t("th_fgd_count"))}">${r.fgds}</td>
            <td class="num" data-label="${esc(t("th_avg_qty"))}">${r.qtyAvg === null ? "\u2014" : fmtDays(r.qtyAvg) + (r.unit && r.unit !== "mixed" ? " " + t("unit_" + r.unit) : "")}</td>
            <td class="num" data-label="${esc(t("th_avg_cost"))}">${fmt(r.avg)}</td>
            <td class="num" data-label="${esc(t("th_range"))}">${fmt(r.min)} \u2013 ${fmt(r.max)}</td>
            <td class="num" data-label="${esc(t("th_share"))}">${grand > 0 ? Math.round((r.sum / grand) * 100) : 0}%</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <p class="records-count">${esc(t("items_footnote"))}</p>`;
  wire();
}

function exportItemDetailCsv(){
  const lines = sortedRecords().flatMap(itemLinesFor);
  if(!lines.length) return;
  const cols = ["fgd_id","fgd_name","coop_name","country","currency","land_block","category","component","item_code","item_label","quantity","unit","cost"];
  const body = lines.map(l => [l.fgdId,l.fgdName,l.coopName,l.country,l.currency,l.block,l.category,l.component,l.code,l.label,l.qty,l.unit,l.value]
    .map(csvEscape).join(","));
  downloadFile(`cps_input_detail_${today()}.csv`, "text/csv", cols.join(",") + "\n" + body.join("\n") + "\n");
  setSaveStatus(t("save_status_csv") + " " + new Date().toLocaleTimeString());
}

function switchTab(tab){
  if(state){
    state.activeTab = tab;
    saveState();
  }
  ["activities","questionnaire"].forEach(name => {
    const panelId = "tabPanel" + name.charAt(0).toUpperCase() + name.slice(1);
    const btnId = "tabBtn" + name.charAt(0).toUpperCase() + name.slice(1);
    document.getElementById(panelId).classList.toggle("active", tab === name);
    document.getElementById(btnId).classList.toggle("active", tab === name);
  });
  BLOCK_TABS.forEach(blockId => {
    const btn = document.getElementById("tabBtnBlock_" + blockId);
    const panel = document.getElementById("blockPanel_" + blockId);
    if(btn) btn.classList.toggle("active", tab === "block_" + blockId);
    if(panel) panel.classList.toggle("active", tab === "block_" + blockId);
  });
}

// A block tab only exists once the farm has area in that state. Hiding it keeps the
// questionnaire down to what the FGD actually needs to answer.
function refreshBlockTabVisibility(){
  if(!state) return;
  let stepNo = 2;
  BLOCK_TABS.forEach(blockId => {
    const btn = document.getElementById("tabBtnBlock_" + blockId);
    const show = num(state.areas[blockId]) > 0;
    btn.style.display = show ? "" : "none";
    if(show) btn.querySelector(".step-num").textContent = stepNo++;
    if(!show && state.activeTab === "block_" + blockId) switchTab("activities");
  });
  document.getElementById("tabBtnQuestionnaire").querySelector(".step-num").textContent = stepNo;
}

// The overview screen has its own two tabs: the list of FGDs, and the comparison
// across all of them. The comparison is a property of the whole device, not of any
// one FGD, so it lives here rather than inside an open questionnaire.
let listTab = "records";
function switchListTab(tab){
  listTab = tab;
  [["records","listPanelRecords","listTabRecords"],
   ["compare","listPanelCompare","listTabCompare"],
   ["items","listPanelItems","listTabItems"]].forEach(([name, panel, btn]) => {
    document.getElementById(panel).classList.toggle("active", tab === name);
    document.getElementById(btn).classList.toggle("active", tab === name);
  });
  if(tab === "records") renderRecordsList();
  else if(tab === "compare") renderCompareTab();
  else renderItemsTab();
}

function applyStaticTranslations(){
  document.querySelectorAll("[data-i18n], [data-i18n-unit]").forEach(el => {
    const unitKey = el.getAttribute("data-i18n-unit");
    const key = unitKey || el.getAttribute("data-i18n");
    const value = unitKey ? ti(unitKey) : t(key);
    // Only replace this node's own text, not any nested elements (e.g. the logo's <span>,
    // or KPI cards whose value is filled in separately by updateTotalsOnly).
    const directTextNode = [...el.childNodes].find(n => n.nodeType === 3);
    if(directTextNode){
      directTextNode.textContent = value;
    } else if(!el.children.length){
      el.textContent = value;
    }
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph")));
  });
  document.title = t("app_title") + " — " + t("app_subtitle");
}

// Blob + createObjectURL downloads can silently fail in some mobile webviews.
// A data: URI on the anchor's href is honoured far more reliably.
function downloadFile(filename, mimeType, content){
  const dataUri = "data:" + mimeType + ";charset=utf-8," + encodeURIComponent(content);
  try{
    const a = document.createElement("a");
    a.href = dataUri;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){
    // Last resort: open it in a new tab so the person can save it manually.
    window.open(dataUri, "_blank");
  }
}

function safeName(s, fallback){
  return (s || fallback).replace(/[^a-z0-9_-]/gi, "_");
}
function today(){ return new Date().toISOString().slice(0,10); }

function csvEscape(v){
  if(v === null || v === undefined) return "";
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// One flat row per FGD. Column names use the internal (English) category ids rather
// than the translated labels, so files from facilitators working in different
// languages line up in the same master sheet.
function csvColumnsForRecord(rec){
  const s = recordSummary(rec);
  const cols = [];
  const push = (label, value) => cols.push([label, value]);

  push("fgd_id", rec.meta.id);
  push("fgd_name", rec.fgdName);
  push("flo_id", rec.floId);
  push("coop_name", rec.coopName);
  push("country", rec.country || "");
  push("area_unit", rec.areaUnit);
  push("area_unit_custom_name", rec.areaUnitOther || "");
  push("currency", rec.currency);
  push("daily_wage", rec.dailyWage);
  push("coffee_type", rec.presentation);
  push("gbe_ratio_kg_of_type_per_1kg_gbe", rec.gbeRatio);
  push("yield_kg_per_productive_area_unit", rec.yieldPerHa);
  push("yield_kg_gbe_per_productive_area_unit", s.yieldGbe);
  push("uses_land_blocks", s.useBlocks ? 1 : 0);
  push("area_establishment", (rec.areas || {}).establishment || "");
  push("area_renovation", (rec.areas || {}).renovation || "");
  push("area_productive", (rec.areas || {}).productive || "");
  push("area_total_coffee", s.farmArea);

  BLOCK_TABS.forEach(blockId => {
    const bs = blockState(rec, blockId);
    COMPONENTS.forEach(c => push(blockId + "_" + c.id + "_per_area_unit", componentMonetary(rec, bs, c)));
  });
  CATEGORIES.forEach(cat => {
    const c = s.perCategory[cat.id];
    push(cat.id + "_selected", c.visible ? 1 : 0);
    push(cat.id + "_entry_mode", c.mode);
    push(cat.id + "_land_status", c.status);
    push(cat.id + "_cost_per_its_area_unit", c.perArea);
    push(cat.id + "_annual_cost", c.annual);
    push(cat.id + "_family_labour_days_per_area_unit", c.hhDays);
    push(cat.id + "_hired_labour_days_per_area_unit", c.hiredDays);
  });
  LAND_STATUSES.forEach(st => {
    const b = s.blocks[st.id];
    push("block_" + st.id + "_area", st.areaKey ? b.area : "");
    push("block_" + st.id + "_cost_per_area_unit", st.areaKey ? b.perArea : "");
    push("block_" + st.id + "_annual_cost", b.total);
  });

  push("total_inputs", s.components.inputs);
  push("total_hired_labour_cost", s.components.hired);
  push("total_variable_costs", s.components.variable);
  push("total_fixed_costs_annualised", s.components.fixed);
  push("total_family_labour_days", s.hhDays);
  push("total_hired_labour_days", s.hiredDays);
  push("total_annual_cost", s.useBlocks ? s.total : "");
  push("total_cps_per_area_unit", s.perAreaCost);
  push("production_kg_in_type", s.useBlocks ? s.production : "");
  push("production_kg_gbe", s.useBlocks ? s.productionGbe : "");
  push("price_per_kg_in_type", s.pricePres === null ? "" : s.pricePres);
  push("price_per_kg_gbe", s.priceGbe === null ? "" : s.priceGbe);
  push("language", rec.meta.lang || "");
  push("created_at", rec.meta.createdAt || "");
  push("updated_at", rec.meta.updatedAt || "");

  return cols;
}

function exportRecordsCsv(recs, isAll){
  const list = recs.filter(Boolean);
  if(!list.length) return;
  const rowsOfCols = list.map(csvColumnsForRecord);
  const header = rowsOfCols[0].map(p => csvEscape(p[0])).join(",");
  const lines = rowsOfCols.map(cols => cols.map(p => csvEscape(p[1])).join(","));
  const csv = header + "\n" + lines.join("\n") + "\n";
  const filename = isAll
    ? `cps_all_fgds_${today()}.csv`
    : `cps_${safeName(list[0].fgdName, "fgd")}_${today()}.csv`;
  downloadFile(filename, "text/csv", csv);
  setSaveStatus(t("save_status_csv") + " " + new Date().toLocaleTimeString());
}

document.getElementById("btnExportJson").addEventListener("click", () => exportRecordJson(state));
document.getElementById("btnExportCsv").addEventListener("click", () => exportRecordsCsv([state], false));
document.getElementById("btnExportAllCsv").addEventListener("click", () => exportRecordsCsv(sortedRecords(), true));
document.getElementById("btnExportAllJson").addEventListener("click", exportAllJson);
document.getElementById("btnDeleteAll").addEventListener("click", deleteAllRecords);
document.getElementById("btnImportJson").addEventListener("click", () => document.getElementById("importFileInput").click());

document.getElementById("importFileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    let parsed;
    try{
      parsed = JSON.parse(evt.target.result);
    }catch(err){
      alert(t("alert_import_invalid"));
      e.target.value = "";
      return;
    }
    const incoming = Array.isArray(parsed) ? parsed : [parsed];
    const usable = incoming.filter(r => r && typeof r === "object" && r.categories);
    if(!usable.length){
      alert(t("alert_import_invalid"));
      e.target.value = "";
      return;
    }
    showConfirm(t("confirm_import").replace("FILENAME", file.name), t("modal_confirm"), () => {
      let lastId = null;
      usable.forEach(raw => {
        const rec = sanitizeRecord(raw);
        // Keep the original id when it is new to this device, so re-importing a backup
        // updates the same FGD instead of piling up duplicates. Give it a fresh id only
        // when that id is already taken by a different FGD.
        if(records[rec.meta.id] && records[rec.meta.id] !== rec) rec.meta.id = generateRecordId();
        records[rec.meta.id] = rec;
        lastId = rec.meta.id;
      });
      persistAllRecords(records);
      recordSearch = "";
      document.getElementById("recordSearch").value = "";
      if(usable.length === 1 && lastId) openRecord(lastId);
      else goToRecordsList();
    });
    e.target.value = "";
  };
  reader.readAsText(file);
});

// ==================== INIT ====================

(function init(){
  let savedLang = null;
  try{ savedLang = localStorage.getItem(STORAGE_KEY_LANG); }catch(e){ /* default stays English */ }
  if(savedLang && TRANSLATIONS[savedLang]) appLang = savedLang;

  records = loadAllRecords();

  // No language chosen on this device yet (first run, or an upgrade from the
  // single-FGD version): fall back to the language the newest FGD was saved in.
  if(!savedLang){
    const newest = sortedRecords()[0];
    const recLang = newest && newest.meta && newest.meta.lang;
    if(recLang && TRANSLATIONS[recLang]) appLang = recLang;
  }

  document.querySelectorAll("#langToggle button").forEach(b =>
    b.classList.toggle("active", b.getAttribute("data-lang") === appLang));
  applyStaticTranslations();
  rebuildPresentationSelect();
  rebuildCountrySelect();

  const list = sortedRecords();
  if(list.length === 1){
    // A single FGD on the device is almost certainly the one being worked on
    // (including a record just migrated from the older single-FGD version).
    openRecord(list[0].meta.id);
  }else{
    screen = "list";
    applyScreen();
    switchListTab("records");
  }
  setSaveStatus(t("save_status_auto"));
})();

// ==================== PWA: service worker ====================
// Only meaningful when served over HTTPS (e.g. GitHub Pages). Silently does nothing
// otherwise; everything else in the tool still works.
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* offline install unavailable */ });
  });
}
</script>
